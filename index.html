<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruta de Estudio · Matemática Básica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A;
    --ink-soft:#3A4C7A;
    --paper:#FBF7ED;
    --paper-dim:#F1E9D6;
    --line:#D9CBAE;
    --coral:#C34A36;
    --gold:#B8891A;
    --teal:#2F6F6B;
    --teal-soft:#E4EFEE;
    --coral-soft:#F7E6E2;
    --gold-soft:#F3E9D2;
    --shadow: rgba(27,42,74,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--paper) 0, var(--paper) 0),
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(27,42,74,0.045) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, rgba(27,42,74,0.035) 28px);
    color:var(--ink);
    font-family:'Source Sans 3',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,h4{font-family:'Fraunces',serif;margin:0 0 .4em 0;letter-spacing:-.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:920px;margin:0 auto;padding:28px 20px 90px;}

  /* ---------- HEADER ---------- */
  #masthead{
    text-align:center;
    padding:18px 10px 30px;
    border-bottom:2px dashed var(--line);
    margin-bottom:34px;
  }
  #masthead .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:.75rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--coral);
    margin-bottom:10px;
  }
  #masthead h1{font-size:2.3rem;font-weight:700;color:var(--ink);}
  #masthead p{color:var(--ink-soft);font-size:1.02rem;max-width:560px;margin:8px auto 0;}
  #progress-wrap{
    margin-top:20px;display:flex;align-items:center;gap:12px;
    justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--ink-soft);
  }
  #progress-bar{width:220px;height:8px;background:var(--paper-dim);border-radius:6px;overflow:hidden;border:1px solid var(--line);}
  #progress-fill{height:100%;background:var(--gold);width:0%;transition:width .4s ease;}

  /* ---------- TIMELINE ---------- */
  #timeline-view{position:relative;}
  #path-line{
    position:absolute;left:50%;top:0;bottom:0;width:3px;
    background:repeating-linear-gradient(180deg,var(--ink-soft) 0 10px, transparent 10px 18px);
    transform:translateX(-50%);
    z-index:0;
  }
  .stations{position:relative;z-index:1;display:flex;flex-direction:column;gap:26px;}
  .station{
    display:flex;align-items:stretch;gap:0;position:relative;
  }
  .station:nth-child(odd) .station-card{margin-right:auto;text-align:left;}
  .station:nth-child(even){flex-direction:row-reverse;}
  .station:nth-child(even) .station-card{margin-left:auto;text-align:left;}

  .station-node{
    flex:0 0 auto;width:52px;height:52px;border-radius:50%;
    background:var(--paper);border:3px solid var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:1.05rem;
    position:relative;z-index:2;margin:0 14px;
    box-shadow:0 2px 0 var(--shadow);
    flex-shrink:0;align-self:center;
  }
  .station.done .station-node{background:var(--gold);border-color:var(--gold);color:var(--paper);}
  .station-node .check{display:none;}
  .station.done .station-node .num{display:none;}
  .station.done .station-node .check{display:block;}

  .station-card{
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;width:calc(50% - 40px);cursor:pointer;
    box-shadow:0 3px 0 var(--shadow);transition:transform .15s ease, box-shadow .15s ease;
  }
  .station-card:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--shadow);}
  .station-card .diff{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.68rem;
    text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:20px;margin-bottom:8px;
  }
  .diff-facil{background:var(--teal-soft);color:var(--teal);}
  .diff-media{background:var(--gold-soft);color:var(--gold);}
  .diff-alta{background:var(--coral-soft);color:var(--coral);}
  .station-card h3{font-size:1.12rem;color:var(--ink);}
  .station-card p{margin:4px 0 0;font-size:.88rem;color:var(--ink-soft);}
  .station.tool .station-card{background:var(--ink);color:var(--paper);}
  .station.tool .station-card h3, .station.tool .station-card p{color:var(--paper);}
  .station.tool .station-node{background:var(--coral);border-color:var(--coral);color:#fff;}

  /* ---------- TOPIC VIEW ---------- */
  #topic-view{display:none;}
  #back-btn{
    font-family:'IBM Plex Mono',monospace;background:none;border:1px solid var(--ink);
    color:var(--ink);padding:8px 14px;border-radius:20px;cursor:pointer;font-size:.85rem;
    margin-bottom:20px;
  }
  #back-btn:hover{background:var(--ink);color:var(--paper);}
  #topic-header{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:20px;}
  #topic-header .diff{
    font-family:'IBM Plex Mono',monospace;font-size:.7rem;text-transform:uppercase;
    letter-spacing:.08em;padding:2px 9px;border-radius:20px;
  }
  #topic-header h2{font-size:1.9rem;margin-top:8px;}
  #topic-content h3{color:var(--teal);font-size:1.25rem;margin-top:30px;border-bottom:1px solid var(--line);padding-bottom:6px;}
  #topic-content h4{font-size:1.02rem;color:var(--ink);margin-top:18px;}
  #topic-content p{line-height:1.6;font-size:1rem;}
  #topic-content ul,#topic-content ol{line-height:1.65;padding-left:22px;}
  #topic-content li{margin-bottom:6px;}

  .example-box{
    background:#fff;border:1px solid var(--line);border-left:4px solid var(--teal);
    border-radius:6px;padding:12px 16px;margin:14px 0;
  }
  .example-box .lbl{font-family:'IBM Plex Mono',monospace;font-size:.72rem;text-transform:uppercase;
    letter-spacing:.08em;color:var(--teal);margin-bottom:6px;}
  .formula{
    font-family:'IBM Plex Mono',monospace;background:var(--paper-dim);
    padding:8px 12px;border-radius:6px;display:inline-block;margin:6px 0;font-size:1rem;
  }
  .tip-box{
    background:var(--gold-soft);border:1px dashed var(--gold);border-radius:8px;
    padding:12px 16px;margin:18px 0;font-size:.94rem;
  }
  .tip-box .lbl{font-weight:700;color:var(--gold);font-family:'IBM Plex Mono',monospace;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;}
  .practice{
    background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:10px 0;
  }
  .practice summary{cursor:pointer;font-weight:600;color:var(--coral);font-family:'IBM Plex Mono',monospace;font-size:.88rem;}
  .practice .sol{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}

  #mark-complete{
    margin-top:34px;font-family:'IBM Plex Mono',monospace;background:var(--gold);color:#fff;
    border:none;padding:12px 22px;border-radius:24px;cursor:pointer;font-size:.9rem;font-weight:600;
  }
  #mark-complete.on{background:var(--teal);}

  /* ---------- GENERATOR ---------- */
  #gen-select{
    font-family:'Source Sans 3',sans-serif;font-size:1rem;padding:9px 12px;border-radius:8px;
    border:1px solid var(--line);margin-right:10px;background:#fff;
  }
  #gen-btn{
    font-family:'IBM Plex Mono',monospace;background:var(--coral);color:#fff;border:none;
    padding:10px 18px;border-radius:20px;cursor:pointer;font-size:.88rem;font-weight:600;
  }
  #gen-output{
    margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:18px 20px;min-height:60px;
  }
  #gen-output .q{font-size:1.08rem;margin-bottom:10px;}
  #gen-reveal{
    font-family:'IBM Plex Mono',monospace;font-size:.82rem;background:none;border:1px solid var(--teal);
    color:var(--teal);padding:6px 14px;border-radius:16px;cursor:pointer;margin-top:8px;
  }
  #gen-solution{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}

  @media (max-width:720px){
    #path-line{left:26px;}
    .station, .station:nth-child(even){flex-direction:row;}
    .station-node{margin:0 12px 0 4px;width:44px;height:44px;font-size:.9rem;}
    .station-card{width:100%;}
    #masthead h1{font-size:1.7rem;}
  }
  :focus-visible{outline:3px solid var(--coral);outline-offset:2px;}
</style>
</head>
<body>
<div id="app">

  <header id="masthead">
    <div class="eyebrow">APR-114 · Matemática básica</div>
    <h1>Ruta de estudio</h1>
    <p>Los 37 temas de tus apuntes, explicados de forma sencilla, ordenados de más fácil a más difícil. Tocá una estación del camino para abrirla.</p>
    <div id="progress-wrap">
      <span id="progress-text">0 / 37 completados</span>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>
  </header>

  <main id="timeline-view">
    <div id="path-line"></div>
    <div class="stations" id="stations"></div>
  </main>

  <main id="topic-view">
    <button id="back-btn">← Volver al camino</button>
    <div id="topic-header">
      <span class="diff" id="topic-diff"></span>
      <h2 id="topic-title"></h2>
    </div>
    <div id="topic-content"></div>
    <button id="mark-complete">Marcar como completado</button>
  </main>

</div>

<script>
/* ============================================================
   DATOS DE LOS TEMAS
   ============================================================ */
const TOPICS = [
{
  id:"numeros-basicos",
  num:1,
  title:"Números y Operaciones Básicas",
  diff:"facil",
  diffLabel:"Fácil",
  blurb:"Sumar, restar, multiplicar y dividir enteros y fracciones, y el orden correcto de las operaciones.",
  content:`
  <h3>Números enteros</h3>
  <p>Los <strong>números enteros</strong> (ℤ) sirven para representar cantidades positivas, negativas y el cero: temperaturas bajo cero, deudas, alturas sobre o bajo el nivel del mar.</p>
  <p class="formula">ℤ = {…, −3, −2, −1, 0, 1, 2, 3, …}</p>

  <h4>➕ Suma de enteros</h4>
  <table style="width:100%;border-collapse:collapse;margin:10px 0;">
    <tr style="background:var(--paper-dim);"><th style="text-align:left;padding:8px;">Caso</th><th style="text-align:left;padding:8px;">Regla</th></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Mismo signo</td><td style="padding:8px;border-top:1px solid var(--line);">Sumá los valores absolutos y conservá el signo. Ej: (−5)+(−3) = −8</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Distinto signo</td><td style="padding:8px;border-top:1px solid var(--line);">Restá el menor del mayor (en valor absoluto) y usá el signo del mayor. Ej: (−10)+15 = 5</td></tr>
  </table>

  <h4>➖ Resta de enteros</h4>
  <p>Restar siempre se convierte en sumar el opuesto:</p>
  <p class="formula">a − b = a + (−b)</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>4 − (−3) = 4 + 3 = <strong>7</strong> &nbsp;·&nbsp; 6 − 4 = 6 + (−4) = <strong>2</strong></p></div>

  <h4>✖️ ➗ Multiplicación y división</h4>
  <p>La regla de los signos es la misma para ambas operaciones:</p>
  <table style="width:100%;border-collapse:collapse;margin:10px 0;">
    <tr style="background:var(--paper-dim);"><th style="text-align:left;padding:8px;">Signos</th><th style="text-align:left;padding:8px;">Resultado</th></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Iguales (+·+ o −·−)</td><td style="padding:8px;border-top:1px solid var(--line);">Positivo</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Distintos (+·− o −·+)</td><td style="padding:8px;border-top:1px solid var(--line);">Negativo</td></tr>
  </table>
  <div class="tip-box"><span class="lbl">Regla fácil</span><br>Con 3 o más factores: contá cuántos son negativos. Si son pares, el resultado es positivo; si son impares, negativo.</div>

  <h3>Fracciones (racionales)</h3>
  <p>Para <strong>sumar o restar</strong> fracciones con igual denominador, se suman los numeradores. Con distinto denominador, hay que buscar el mínimo común múltiplo (m.c.m.):</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>1/2 + 1/3 → m.c.m.(2,3)=6 → 3/6 + 2/6 = <strong>5/6</strong></p></div>
  <p>Para <strong>multiplicar</strong>, se multiplican numeradores entre sí y denominadores entre sí. Para <strong>dividir</strong>, se multiplica por el recíproco de la segunda fracción.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>3/4 × 2/9 = 6/36 = <strong>1/6</strong> &nbsp;·&nbsp; 2/5 ÷ 3/10 = 2/5 × 10/3 = <strong>4/3</strong></p></div>

  <h3>Propiedades de las operaciones</h3>
  <table style="width:100%;border-collapse:collapse;margin:10px 0;">
    <tr style="background:var(--paper-dim);"><th style="text-align:left;padding:8px;">Propiedad</th><th style="text-align:left;padding:8px;">Fórmula</th></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Conmutativa</td><td style="padding:8px;border-top:1px solid var(--line);">a+b=b+a &nbsp;·&nbsp; a·b=b·a</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Asociativa</td><td style="padding:8px;border-top:1px solid var(--line);">(a+b)+c=a+(b+c) &nbsp;·&nbsp; (a·b)·c=a·(b·c)</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Distributiva</td><td style="padding:8px;border-top:1px solid var(--line);">a·(b+c) = a·b + a·c</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Inverso aditivo</td><td style="padding:8px;border-top:1px solid var(--line);">a + (−a) = 0</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Inverso multiplicativo</td><td style="padding:8px;border-top:1px solid var(--line);">a · (1/a) = 1 &nbsp;(a≠0)</td></tr>
  </table>

  <h3>Orden de las operaciones (PEMDAS)</h3>
  <div class="tip-box"><span class="lbl">Orden correcto</span><br>1️⃣ Paréntesis → 2️⃣ Exponentes → 3️⃣ Multiplicaciones y divisiones (izq. a der.) → 4️⃣ Sumas y restas (izq. a der.)</div>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>3 + 5×4 + 2³ − 18÷2 = 3 + 20 + 8 − 9 = <strong>22</strong></p></div>

  <div class="tip-box"><span class="lbl">Antes de seguir</span><br>Estas reglas de signos y de orden se van a usar en todos los temas siguientes, especialmente al simplificar expresiones algebraicas y resolver ecuaciones.</div>

  <h3>Practicá</h3>
  <details class="practice"><summary>Calculá: (−7) + (−11)</summary><div class="sol">Mismo signo: se suman los valores y se conserva el signo → <strong>−18</strong></div></details>
  <details class="practice"><summary>Calculá: 25 ÷ (−5) + 4 · 3</summary><div class="sol">División primero: −5. Multiplicación: 12. Suma: −5+12 = <strong>7</strong></div></details>
  `
},
{
  id:"metodo",
  num:2,
  title:"El Método Científico",
  diff:"facil",
  diffLabel:"Fácil",
  blurb:"Cómo se construye el conocimiento científico, paso a paso.",
  content:`
  <h3>¿Qué es?</h3>
  <p>Es el camino que sigue la ciencia para descubrir cómo funciona el mundo: observar algo, hacerse una pregunta, proponer una posible explicación y comprobarla con la realidad. No se basa en la fe ni en "magia": todo lo que afirma se puede poner a prueba, y si los hechos lo contradicen, se descarta.</p>

  <h3>Los 6 pasos, explicados simple</h3>
  <ol>
    <li><strong>Observación:</strong> me doy cuenta de algo que pasa. <em>Ej: noto que las plantas de mi balcón que reciben más sol crecen más rápido.</em></li>
    <li><strong>Inducción y preguntas:</strong> esa observación despierta una pregunta. <em>Ej: ¿el sol influye en el crecimiento de las plantas?</em></li>
    <li><strong>Hipótesis:</strong> propongo una respuesta posible, que se pueda comprobar. <em>Ej: "a más horas de sol, más rápido crece la planta".</em></li>
    <li><strong>Experimentación:</strong> pongo a prueba la hipótesis varias veces. <em>Ej: mido el crecimiento de 10 plantas con distintas horas de sol durante un mes.</em></li>
    <li><strong>Demostración:</strong> reviso los resultados y veo si la hipótesis se cumplió, se cumplió a medias, o no se cumplió.</li>
    <li><strong>Tesis:</strong> si la hipótesis se sostuvo en todos los casos, se convierte en una conclusión válida (y puede llegar a ser ley o teoría).</li>
  </ol>

  <h3>Los dos pilares</h3>
  <div class="example-box">
    <div class="lbl">Reproducibilidad</div>
    <p>Cualquier otra persona, siguiendo los mismos pasos, debe poder repetir el experimento y obtener el mismo resultado. Por eso los papers científicos detallan todo el procedimiento.</p>
  </div>
  <div class="example-box">
    <div class="lbl">Refutabilidad</div>
    <p>Toda afirmación científica debe poder imaginarse falsa en algún caso posible. <em>Ejemplo de algo NO refutable:</em> "todos los gatos violeta son hembras" — no se puede probar ni refutar porque no existen gatos violeta observables.</p>
  </div>

  <h3>Método científico vs. NO método científico</h3>
  <table style="width:100%;border-collapse:collapse;margin:12px 0;">
    <tr style="background:var(--paper-dim);"><th style="text-align:left;padding:8px;">SÍ es</th><th style="text-align:left;padding:8px;">NO es</th></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Leyes que se rechazan si los hechos las contradicen</td><td style="padding:8px;border-top:1px solid var(--line);">Leyes "de fe", indemostrables</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Se apoya en la experiencia y la observación</td><td style="padding:8px;border-top:1px solid var(--line);">Fórmulas "mágicas" o rituales</td></tr>
  </table>

  <div class="tip-box"><span class="lbl">Antes de seguir</span><br>
  Vas a usar esta misma lógica de "proponer algo y comprobarlo" en el próximo tema: las demostraciones matemáticas. La diferencia es que ahí no se experimenta con la realidad, sino que se demuestra con lógica pura.</div>

  <h3>Practicá</h3>
  <details class="practice"><summary>Un científico nota que su pan tarda menos en enmohecerse en la heladera. ¿Qué paso del método está aplicando si guarda 5 panes en la heladera y 5 afuera para comparar?</summary>
  <div class="sol">Está en el paso de <strong>Experimentación</strong>: está poniendo a prueba, de forma controlada y repetible, la hipótesis de que el frío retrasa el moho.</div></details>
  `
},
{
  id:"logica",
  num:3,
  title:"Formalización de Proposiciones",
  diff:"facil",
  diffLabel:"Fácil",
  blurb:"Traducir frases del lenguaje cotidiano a símbolos lógicos.",
  content:`
  <h3>¿Qué es una proposición?</h3>
  <p>Es cualquier frase de la que se pueda decir, sin ambigüedad, si es <strong>verdadera</strong> o <strong>falsa</strong>. Se representan con letras: p, q, r...</p>
  <div class="example-box"><div class="lbl">Sí son proposiciones</div><p>"Dos es par" &nbsp;·&nbsp; "Tres es mayor que siete" &nbsp;·&nbsp; "Cinco es impar"</p></div>
  <div class="example-box"><div class="lbl">No son proposiciones</div><p>"¿Es dos un número par?" (pregunta) &nbsp;·&nbsp; "¡Súmale cinco!" (orden) &nbsp;·&nbsp; "Dos más tres" (no afirma nada)</p></div>

  <h3>Los 5 conectivos (con tabla de verdad simple)</h3>
  <p>Los conectivos unen proposiciones simples para formar una más compleja. V = verdadero, F = falso.</p>

  <h4>Negación (¬ o ∼) — "no..."</h4>
  <p>Da vuelta el valor de verdad de p.</p>
  <table style="border-collapse:collapse;"><tr style="background:var(--paper-dim);"><td style="padding:6px 14px;">p</td><td style="padding:6px 14px;">¬p</td></tr>
  <tr><td style="padding:6px 14px;border-top:1px solid var(--line);">V</td><td style="padding:6px 14px;border-top:1px solid var(--line);">F</td></tr>
  <tr><td style="padding:6px 14px;">F</td><td style="padding:6px 14px;">V</td></tr></table>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>p: "dos es par" → ¬p: "dos no es par" (falso, porque p es verdadera)</p></div>

  <h4>Conjunción (∧) — "... y ..."</h4>
  <p>Solo es verdadera cuando <strong>ambas</strong> proposiciones son verdaderas.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>p: "dos es par" (V), q: "tres es impar" (V) → (p ∧ q) es <strong>verdadera</strong></p></div>

  <h4>Disyunción (∨) — "... o ..."</h4>
  <p>Es verdadera si <strong>al menos una</strong> de las dos proposiciones es verdadera.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>p: "dos es mayor que siete" (F), q: "siete es mayor que dos" (V) → (p ∨ q) es <strong>verdadera</strong></p></div>

  <h4>Implicación (→) — "si... entonces..."</h4>
  <p>Solo es falsa cuando p es verdadera y q es falsa. En todos los demás casos es verdadera.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>"si dos es par entonces tres es impar" → (p → q). Como p es V y q es V, la implicación es <strong>verdadera</strong>.</p></div>

  <h4>Bicondicional (↔) — "... si y solo si ..."</h4>
  <p>Es verdadera cuando p y q tienen <strong>el mismo</strong> valor de verdad (ambas V o ambas F).</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>"dos es mayor que siete si y solo si siete es menor que dos" → ambas son falsas, entonces (p ↔ q) es <strong>verdadera</strong>.</p></div>

  <h3>Cómo formalizar una frase completa</h3>
  <p>Ejemplo con p: "2 es par", q: "3 es impar", u: "2 es impar", r: "5 &lt; 7", s: "5 &gt; 7", t: "5 = 7":</p>
  <ul>
    <li>"Si dos es par entonces tres es impar" → <span class="formula">(p → q)</span></li>
    <li>"No es verdad que dos es par o impar" → <span class="formula">¬(p ∨ u)</span></li>
    <li>"Si no es verdad que cinco es menor que siete, entonces cinco es mayor o igual que siete" → <span class="formula">(¬r → (s ∨ t))</span></li>
  </ul>

  <div class="tip-box"><span class="lbl">Antes de seguir</span><br>
  Estos símbolos (¬, ∧, ∨, →) son exactamente los que vas a usar en el siguiente tema para escribir demostraciones matemáticas, sobre todo en la demostración por contradicción.</div>

  <h3>Practicá</h3>
  <details class="practice"><summary>Formalizá: "No es cierto que cinco sea igual a siete" (t: "5=7")</summary><div class="sol"><span class="formula">¬t</span></div></details>
  `
},

  <h3>Proporcionalidad directa</h3>

  content:`
  <h3>¿Qué es demostrar?</h3>
  <p>Es probar, con una cadena de pasos lógicos, que un enunciado matemático (una hipótesis) es verdadero. Cuando una hipótesis queda demostrada, pasa a llamarse <strong>teorema</strong>.</p>
  <h3>Reglas generales al demostrar</h3>
  <ul>
    <li>Escribí toda la información que estás usando.</li>
    <li>Cada paso debe seguir lógicamente del anterior.</li>
    <li>Cubrí todos los casos posibles (si vale para pares, probá también para impares si la afirmación es sobre "todos los enteros").</li>
    <li>Terminá con una conclusión clara.</li>
  </ul>

  <h3>Las 4 técnicas, de la más intuitiva a la más abstracta</h3>

  <h4>1) Por deducción</h4>
  <p>Usás hechos conocidos y avanzás paso a paso hasta la conclusión.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>"Si hoy es fin de semana, mañana es entre semana." Los posibles días de fin de semana son sábado y domingo. Si hoy es sábado, mañana es domingo (¡sigue siendo fin de semana!, el argumento falla). Si hoy es domingo, mañana es lunes (entre semana, se cumple).</p></div>

  <h4>2) Por contraejemplo</h4>
  <p>Sirve para demostrar que algo <strong>NO</strong> es cierto: alcanza con encontrar un solo caso donde falle.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Afirmación a refutar: "la suma de los cuadrados de dos enteros siempre da otro cuadrado perfecto". Probamos con 2²=4 y 3²=9 → 4+9=13, y 13 no es un cuadrado perfecto. Con un solo contraejemplo, la afirmación queda refutada.</p></div>

  <h4>3) Por casos</h4>
  <p>Se revisan todos los casos posibles, uno por uno.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Probar que la suma de dos cuadrados perfectos consecutivos (entre 1 y 81) siempre da impar: 4+9=13, 9+16=25, 16+25=41, 25+36=61... todos impares. Se revisaron todos los casos posibles y se cumple siempre.</p></div>

  <h4>4) Por contradicción (reducción al absurdo)</h4>
  <p>Se asume lo <strong>contrario</strong> de lo que se quiere probar, y se llega a un absurdo. Como el supuesto contrario es imposible, lo original queda demostrado.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Probar que no existen enteros a y b tales que 5a + 10b = 1.<br>
  1. Suponemos lo contrario: que sí existen.<br>
  2. Dividimos por 5: a + 2b = 1/5.<br>
  3. Pero a + 2b tiene que ser un entero (suma de enteros), y 1/5 no lo es → contradicción.<br>
  4. Como la suposición lleva a un absurdo, es falsa → el enunciado original es verdadero.</p></div>

  <div class="tip-box"><span class="lbl">¿Cuál técnica uso?</span><br>
  • ¿Quiero probar que algo <strong>es falso</strong>? → Contraejemplo.<br>
  • ¿Hay pocos casos posibles para revisar? → Por casos.<br>
  • ¿Puedo avanzar paso a paso desde lo que ya sé? → Deducción.<br>
  • ¿Es más fácil suponer lo contrario y buscar un absurdo? → Contradicción.</div>

  <h3>Practicá</h3>
  <details class="practice"><summary>Para refutar "todo número impar es primo", ¿qué técnica conviene usar?</summary><div class="sol">Por contraejemplo: 9 es impar pero no es primo (9 = 3×3). Con ese único caso alcanza.</div></details>
  `

  content:`
  <h3>¿Qué es el módulo?</h3>
  <p>Cuando dividís dos enteros, obtenés un cociente y un resto: <span class="formula">A ÷ B = Q resto R</span>. El operador <strong>módulo</strong> (mod) te da directamente ese resto: <span class="formula">A mod B = R</span>.</p>

  <h3>Ejemplo con números positivos</h3>
  <div class="example-box"><div class="lbl">8 mod 4</div>
  <p>Pensalo como un reloj con los números 0,1,2,3. Empezás en 0 y avanzás 8 pasos: 1,2,3,0,1,2,3,0. Terminás en <strong>0</strong>. Entonces 8 mod 4 = 0. (Coincide con que 8 ÷ 4 = 2 resto 0.)</p></div>
  <div class="example-box"><div class="lbl">13 mod 5</div>
  <p>13 ÷ 5 = 2 resto 3. Entonces 13 mod 5 = 3.</p></div>

  <div class="example-box"><div class="lbl">-5 mod 3</div>
  <p>Reloj con 0,1,2. Como el número es negativo, se avanza en sentido contrario: desde 0 retrocedés 5 pasos: 2,1,0,2,1. Terminás en <strong>1</strong>. Entonces -5 mod 3 = 1.</p></div>

  <h3>¿Para qué sirve?</h3>
  <p>Se usa muchísimo en programación e informática: relojes (horas mod 24), calendarios (días mod 7), generar índices circulares en listas, criptografía, etc.</p>

  content:`
  <h3>¿Qué es?</h3>
  <p>Es una fracción donde el numerador y el denominador son polinomios: <span class="formula">p(x) / q(x)</span>, con la condición de que q(x) ≠ 0.</p>

  <h3>Dominio: los valores prohibidos</h3>
  <p>El dominio es todo lo que la variable <strong>sí</strong> puede valer. Como no se puede dividir por 0, hay que encontrar qué valores de x harían 0 al denominador, y esos quedan excluidos.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>(3x+2)/(x-4): x-4=0 → x=4. El dominio es todos los reales excepto el 4.</p></div>
  <div class="example-box"><div class="lbl">Ejemplo con denominador cuadrático</div><p>(x+7)/(x²+8x-9): factorizo x²+8x-9 = (x+9)(x-1) = 0 → x=-9 o x=1. Dominio: todos los reales excepto -9 y 1.</p></div>

  <h3>Simplificar (3 pasos)</h3>
  <ol>
    <li>Determiná el dominio (valores excluidos).</li>
    <li>Factorizá numerador y denominador.</li>
    <li>Cancelá los factores que se repiten arriba y abajo.</li>
  </ol>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>(x+3)/(x²+12x+27) → factorizo el denominador: (x+3)(x+9) → simplifico (x+3) arriba y abajo → queda 1/(x+9). Dominio: todos los reales excepto -3 y -9.</p></div>

  <h3>Multiplicación</h3>
  <p class="formula">(A/B) · (C/D) = AC/BD</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>(x²+2x-3)/(x²+8x+16) · (3x+12)/(x-1) = (x-1)(x+3)/(x+4)² · 3(x+4)/(x-1) = 3(x+3)/(x+4)</p></div>

  <h3>División</h3>

  <h3>Fracciones compuestas</h3>
  <p>Son fracciones "dentro" de fracciones. Se resuelven combinando numerador y denominador en una sola fracción, e invirtiendo.</p>

  <div class="tip-box"><span class="lbl">Antes de seguir</span><br>Para todo este tema tenés que dominar la factorización del tema anterior. Si te trabaste acá, repasá "Expresiones Algebraicas" primero.</div>

  <h3>Practicá</h3>
  <details class="practice"><summary>Encontrá el dominio de (x-4)/(x²-4)</summary><div class="sol">x²-4 = (x-2)(x+2) = 0 → x=2 o x=-2. Dominio: todos los reales excepto 2 y -2.</div></details>
  `

  content:`
  <h3>Notación de sumatoria (Σ)</h3>
  <p>La letra griega <strong>Σ</strong> (sigma mayúscula) es una forma corta de escribir una suma larga. Te dice desde dónde empieza el índice, hasta dónde termina, y qué expresión se suma en cada paso.</p>
  <p class="formula">Σ (k=1 hasta n) f(k) = f(1) + f(2) + f(3) + ... + f(n)</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Σ (k=1 hasta 4) k² = 1² + 2² + 3² + 4² = 1+4+9+16 = <strong>30</strong></p></div>
  <div class="tip-box"><span class="lbl">Para leer expresiones como "2³+4³+6³+...+(2n)³"</span><br>Es una sumatoria donde cada término es (2k)³, con k yendo de 1 a n. Fijate siempre el patrón entre términos consecutivos antes de asumir cuál es la fórmula general.</div>
  <h3>Practicá</h3>
  <details class="practice"><summary>Escribí en notación de sumatoria: 3+6+9+12+...+3n</summary><div class="sol">Cada término es 3k, con k de 1 a n → Σ (k=1 hasta n) 3k</div></details>

  <h3>Principio de buena ordenación</h3>
  <p>Antes de ver inducción, vale la pena conocer esta propiedad de los naturales, porque es la que garantiza que la inducción funcione: <strong>todo subconjunto no vacío de ℕ tiene un elemento mínimo</strong> (un elemento más chico que todos los demás del subconjunto).</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>El subconjunto {4,7,9,12} de ℕ tiene mínimo: el 4. Incluso un subconjunto infinito como los números pares {2,4,6,8,...} tiene mínimo: el 2. Esto NO pasa en ℤ (los enteros): el subconjunto de los enteros negativos no tiene mínimo, porque siempre hay uno más chico.</p></div>
  <div class="tip-box"><span class="lbl">Por qué importa acá</span><br>Este principio es equivalente al principio de inducción: se puede demostrar uno a partir del otro. Intuitivamente, es lo que asegura que la fila de fichas de dominó (la analogía de abajo) tiene una <strong>primera</strong> ficha por donde empezar.</div>

  <h3>¿Qué es la inducción matemática?</h3>
  <p>Es una técnica de demostración pensada para probar que una afirmación P(n) es verdadera para <strong>todos</strong> los números naturales a partir de un valor inicial (normalmente n=1), sin tener que comprobarla uno por uno (lo cual sería imposible, porque son infinitos).</p>
  <div class="tip-box"><span class="lbl">Analogía de las fichas de dominó</span><br>Imaginá una fila infinita de fichas de dominó paradas. Si (1) empujás la primera y se cae, y (2) sabés que cada ficha que se cae siempre tira a la siguiente, entonces podés estar seguro de que <strong>todas</strong> las fichas se van a caer, sin necesidad de empujarlas una por una.</div>
  <h4>Los 3 pasos de toda demostración por inducción</h4>
  <ol>
    <li><strong>Caso base:</strong> demostrás que P(n) es verdadera para el primer valor (generalmente n=1). Es "empujar la primera ficha".</li>
    <li><strong>Hipótesis de inducción:</strong> <em>asumís</em> (no demostrás, solo suponés) que P(k) es verdadera para un k cualquiera. Es "suponer que una ficha cualquiera se cae".</li>
    <li><strong>Paso inductivo:</strong> usando esa hipótesis, demostrás que P(k+1) también es verdadera. Es "demostrar que esa ficha tira a la siguiente".</li>
  </ol>
  <div class="tip-box"><span class="lbl">Conclusión</span><br>Si cumplís los 3 pasos, por el Principio de Inducción, P(n) es verdadera para todo n mayor o igual al valor del caso base.</div>

  <h3>Variación 1: Demostrar fórmulas de suma</h3>
  <p>Se usa para probar que la suma de una secuencia de números tiene una fórmula cerrada. Vamos con un ejemplo completo, paso a paso.</p>
  <div class="example-box"><div class="lbl">Ejemplo: demostrar que 1+3+5+...+(2n−1) = n², para n≥1</div>
  <p><strong>1) Caso base (n=1):</strong> el lado izquierdo tiene un solo término: 2(1)−1 = 1. El lado derecho: 1² = 1. Como 1=1, se cumple. ✓</p>
  <p><strong>2) Hipótesis de inducción:</strong> suponemos que vale para n=k: 1+3+5+...+(2k−1) = k²</p>
  <p><strong>3) Paso inductivo (probar para n=k+1):</strong> queremos ver que 1+3+...+(2k−1)+(2(k+1)−1) = (k+1)²<br>
  Tomamos la hipótesis y sumamos el término siguiente (2(k+1)−1 = 2k+1) a ambos lados:<br>
  [1+3+...+(2k−1)] + (2k+1) = k² + (2k+1)<br>
  Por la hipótesis, el corchete es k², entonces el lado izquierdo queda k² + 2k + 1.<br>
  Y k² + 2k + 1 = (k+1)² ✓ (es el cuadrado de un binomio)<br>
  Llegamos exactamente a lo que queríamos probar, así que el paso inductivo queda demostrado.</p>
  <p><strong>Conclusión:</strong> por el principio de inducción, 1+3+5+...+(2n−1)=n² es verdadera para todo n≥1.</p>
  </div>
  <div class="tip-box"><span class="lbl">El truco que se repite siempre en esta variación</span><br>En el paso inductivo, siempre partís de la hipótesis y le sumás el término número (k+1) a ambos lados. Después tenés que <strong>factorizar o expandir</strong> algebraicamente el resultado hasta que se parezca a la fórmula original evaluada en (k+1). Ahí es donde más sirve repasar productos notables y factorización.</div>
  <h3>Practicá</h3>
  <details class="practice"><summary>En la demostración de que 2+4+6+...+2n = n(n+1), ¿cuál sería el caso base y qué habría que verificar?</summary><div class="sol">Caso base n=1: lado izquierdo = 2(1) = 2. Lado derecho = 1(1+1) = 2. Como 2=2, se cumple el caso base.</div></details>
  <details class="practice"><summary>Si la hipótesis de inducción es "1+2+...+k = k(k+1)/2", ¿qué término hay que sumar a ambos lados para probar el caso k+1?</summary><div class="sol">Hay que sumar (k+1), que es el siguiente término de la secuencia.</div></details>

  <h3>Variación 2: Demostrar desigualdades</h3>
  <p>La misma estructura de 3 pasos sirve para probar que una desigualdad se cumple para todo n, solo que en el paso inductivo hay que trabajar con desigualdades en vez de igualdades.</p>
  <div class="example-box"><div class="lbl">Ejemplo: demostrar que 2ⁿ &gt; n, para todo n≥1</div>
  <p><strong>1) Caso base (n=1):</strong> 2¹=2 y n=1. Como 2&gt;1, se cumple. ✓</p>
  <p><strong>2) Hipótesis de inducción:</strong> suponemos que 2ᵏ &gt; k</p>
  <p><strong>3) Paso inductivo:</strong> queremos ver que 2<sup>k+1</sup> &gt; k+1<br>
  2<sup>k+1</sup> = 2·2ᵏ. Por la hipótesis, 2ᵏ &gt; k, entonces 2·2ᵏ &gt; 2k.<br>
  Y como k≥1, sabemos que 2k = k+k ≥ k+1.<br>
  Entonces 2<sup>k+1</sup> &gt; 2k ≥ k+1, es decir 2<sup>k+1</sup> &gt; k+1 ✓</p>
  <p><strong>Conclusión:</strong> por inducción, 2ⁿ &gt; n para todo n≥1.</p>
  </div>
  <h3>Practicá</h3>
  <details class="practice"><summary>Para demostrar que 3ⁿ ≥ 2n+1 por inducción, ¿qué desigualdad sería la hipótesis de inducción?</summary><div class="sol">3ᵏ ≥ 2k+1 (se asume verdadera para n=k)</div></details>

  <h3>Divisibilidad de números enteros</h3>
  <p>Decimos que un entero <strong>a divide a</strong> un entero <strong>b</strong> (se escribe a∣b) si existe un entero k tal que b = a·k. En otras palabras, b es múltiplo de a, o b÷a da resto 0.</p>
  <p class="formula">a∣b &nbsp;⟺&nbsp; existe k∈ℤ tal que b = a·k</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>4∣12 porque 12 = 4·3 (k=3, es entero). En cambio 5∤12 porque no existe ningún entero k tal que 12=5·k.</p></div>
  <h4>Propiedades más usadas (clave para combinarlas con inducción)</h4>
  <table style="width:100%;border-collapse:collapse;margin:10px 0;">
    <tr style="background:var(--paper-dim);"><th style="text-align:left;padding:8px;">Propiedad</th><th style="text-align:left;padding:8px;">En palabras</th></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Si a∣b y a∣c, entonces a∣(b+c)</td><td style="padding:8px;border-top:1px solid var(--line);">Si a divide a dos números, divide a su suma</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Si a∣b, entonces a∣(b·c) para cualquier entero c</td><td style="padding:8px;border-top:1px solid var(--line);">Si a divide a b, divide a cualquier múltiplo de b</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Si a∣b y b∣c, entonces a∣c</td><td style="padding:8px;border-top:1px solid var(--line);">Propiedad transitiva</td></tr>
  </table>
  <div class="tip-box"><span class="lbl">Por qué importa la primera propiedad</span><br>Es la que más se usa en el paso inductivo: si sabés (por la hipótesis) que un número k divide a A, y podés escribir la expresión de (k+1) como "A + otro término que también es múltiplo de ese número", entonces por esta propiedad, ese número también divide a la suma completa.</div>
  <h3>Practicá</h3>
  <details class="practice"><summary>¿Es verdad que 6∣48?</summary><div class="sol">Sí: 48 = 6·8, y 8 es entero → 6∣48</div></details>
  <details class="practice"><summary>Si 7∣a y 7∣b, ¿qué podés afirmar sobre a−b?</summary><div class="sol">7∣(a−b), por la misma propiedad de la suma (funciona igual para la resta)</div></details>

  <h3>Números primos y factorización</h3>
  <p>Un <strong>número primo</strong> es un entero mayor que 1 que solo es divisible por 1 y por sí mismo (2, 3, 5, 7, 11, 13...). Un número que no es primo (y es mayor que 1) se llama <strong>compuesto</strong>, y siempre se puede escribir como producto de números primos: eso se llama <strong>factorización en primos</strong>.</p>
  <div class="example-box"><div class="lbl">Ejemplo: factorizar 60 en primos</div><p>60 = 2·30 = 2·2·15 = 2·2·3·5 → 60 = 2²·3·5<br>Truco: dividí siempre por el primo más chico posible (2, después 3, después 5...) hasta llegar a 1.</p></div>

  <h3>Máximo Común Divisor (M.C.D.)</h3>
  <p>El M.C.D. de dos números es el <strong>número más grande</strong> que divide a ambos a la vez.</p>
  <h4>Método 1: por factorización en primos</h4>
  <p>Factorizás ambos números y tomás los primos <strong>comunes</strong>, elevados al <strong>menor</strong> exponente con el que aparecen.</p>
  <div class="example-box"><div class="lbl">Ejemplo: M.C.D.(60, 84)</div>
  <p>60 = 2²·3·5<br>84 = 2²·3·7<br>Primos comunes: 2 (menor exponente: 2² en ambos) y 3 (menor exponente: 3¹ en ambos). El 5 y el 7 no son comunes, se descartan.<br>M.C.D.(60,84) = 2²·3 = <strong>12</strong></p></div>
  <h4>Método 2: algoritmo de Euclides (más rápido para números grandes)</h4>
  <p>Se divide el número mayor por el menor, y se repite el proceso reemplazando el número mayor por el resto, hasta que el resto dé 0. El M.C.D. es el último divisor usado (el último resto distinto de cero).</p>
  <div class="example-box"><div class="lbl">Ejemplo: M.C.D.(60, 84) con Euclides</div>
  <p>84 ÷ 60 = 1, resto 24<br>60 ÷ 24 = 2, resto 12<br>24 ÷ 12 = 2, resto 0 → cuando el resto da 0, el M.C.D. es el divisor de ese último paso.<br>M.C.D.(60,84) = <strong>12</strong> (mismo resultado que con factorización)</p></div>

  <h3>Mínimo Común Múltiplo (m.c.m.)</h3>
  <p>El m.c.m. de dos números es el <strong>número más chico</strong> (mayor que 0) que es múltiplo de ambos a la vez.</p>
  <h4>Por factorización en primos</h4>
  <p>Factorizás ambos números y tomás <strong>todos</strong> los primos que aparecen (comunes y no comunes), elevados al <strong>mayor</strong> exponente con el que aparecen.</p>
  <div class="example-box"><div class="lbl">Ejemplo: m.c.m.(60, 84)</div>
  <p>60 = 2²·3·5<br>84 = 2²·3·7<br>Todos los primos: 2, 3, 5, 7. Mayor exponente de cada uno: 2², 3¹, 5¹, 7¹<br>m.c.m.(60,84) = 2²·3·5·7 = <strong>420</strong></p></div>
  <h4>Atajo si ya tenés el M.C.D.</h4>
  <p>El producto de dos números siempre es igual al producto de su M.C.D. por su m.c.m.:</p>
  <p class="formula">a · b = M.C.D.(a,b) · m.c.m.(a,b)</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Ya sabemos que M.C.D.(60,84)=12. Entonces: m.c.m.(60,84) = (60·84)/12 = 5040/12 = <strong>420</strong> (mismo resultado)</p></div>
  <div class="tip-box"><span class="lbl">¿Cuándo uso cada uno?</span><br>• M.C.D.: para simplificar fracciones al máximo, o repartir cosas en grupos iguales lo más grandes posible.<br>• m.c.m.: para sumar/restar fracciones con distinto denominador, o saber cuándo coinciden dos eventos que se repiten con distinta frecuencia (ej: dos alarmas).</div>
  <h3>Practicá</h3>
  <details class="practice"><summary>Calculá el M.C.D.(18, 24) por factorización en primos</summary><div class="sol">18 = 2·3², 24 = 2³·3 → primos comunes: 2 (menor exponente 2¹) y 3 (menor exponente 3¹) → M.C.D. = 2·3 = 6</div></details>
  <details class="practice"><summary>Calculá el m.c.m.(18, 24)</summary><div class="sol">Todos los primos con mayor exponente: 2³·3² = 8·9 = 72. (Chequeo: 18·24=432, y 432/6=72 ✓)</div></details>
  <details class="practice"><summary>Usá el algoritmo de Euclides para hallar M.C.D.(48, 18)</summary><div class="sol">48÷18=2 resto 12 · 18÷12=1 resto 6 · 12÷6=2 resto 0 → M.C.D. = 6</div></details>

  <h3>Variación 3: Inducción aplicada a divisibilidad</h3>
  <p>Acá el objetivo no es probar una fórmula, sino probar que una expresión siempre es múltiplo de un número fijo.</p>
  <div class="example-box"><div class="lbl">Ejemplo: demostrar que 3∣(n³−n), para todo n≥1</div>
  <p><strong>1) Caso base (n=1):</strong> n³−n = 1−1 = 0. Y 3∣0 porque 0=3·0. ✓</p>
  <p><strong>2) Hipótesis de inducción:</strong> suponemos que 3∣(k³−k), es decir, k³−k = 3·m para algún entero m</p>
  <p><strong>3) Paso inductivo:</strong> queremos ver que 3∣((k+1)³−(k+1))<br>
  Expandimos (k+1)³ = k³+3k²+3k+1, entonces:<br>
  (k+1)³−(k+1) = k³+3k²+3k+1−k−1 = (k³−k) + 3k²+3k<br>
  Por la hipótesis, k³−k = 3m, entonces:<br>
  (k+1)³−(k+1) = 3m + 3k²+3k = 3(m+k²+k)<br>
  Como m+k²+k es un entero, esto muestra que (k+1)³−(k+1) es múltiplo de 3. ✓</p>
  <p><strong>Conclusión:</strong> por inducción, 3∣(n³−n) para todo n≥1.</p>
  </div>
  <div class="tip-box"><span class="lbl">El truco que se repite siempre en esta variación</span><br>En el paso inductivo, siempre expandís la expresión para n=k+1, la reescribís de forma que aparezca la expresión original (la de n=k) sumada a "algo más", reemplazás esa parte por la hipótesis (que es múltiplo del número), y sacás factor común para mostrar que todo junto sigue siendo múltiplo de ese número.</div>
  <h3>Practicá</h3>
  <details class="practice"><summary>En una demostración de que 2∣(n²+n), ¿cuál sería el caso base?</summary><div class="sol">n=1: n²+n = 1+1 = 2, y 2∣2 porque 2=2·1. Se cumple el caso base.</div></details>
  <details class="practice"><summary>Si sabés que k²+k = 2m (hipótesis), ¿cómo escribirías (k+1)²+(k+1) en términos de esa hipótesis?</summary><div class="sol">(k+1)²+(k+1) = k²+2k+1+k+1 = (k²+k) + (2k+2) = 2m + 2(k+1) = 2(m+k+1), que es múltiplo de 2.</div></details>

  <h3>Verificar una proposición: ¿verdadera o falsa?</h3>
  <p>Antes de lanzarte a demostrar algo por inducción, conviene probar con algunos valores chicos de n (n=1, 2, 3...). Si en algún momento falla, ya encontraste un <strong>contraejemplo</strong> y la afirmación es falsa (no hace falta seguir probando ni intentar demostrarla). Si se cumple en varios casos y no encontrás ningún fallo, ahí sí tiene sentido intentar la demostración por inducción.</p>
  <div class="example-box"><div class="lbl">Ejemplo clásico: "n²+n+41 es primo, para todo entero positivo n"</div>
  <p>Probamos: n=1 → 43 (primo) ✓ &nbsp;· n=2 → 47 (primo) ✓ &nbsp;· n=3 → 53 (primo) ✓ ... y de hecho se cumple hasta n=39.<br>
  Pero en n=40: 40²+40+41 = 1600+40+41 = 1681 = 41² → <strong>no es primo</strong>.<br>
  Con ese único contraejemplo (n=40), la afirmación queda refutada, aunque parecía cumplirse en 39 casos seguidos.</p>
  </div>
  <div class="tip-box"><span class="lbl">Moraleja</span><br>Que una afirmación se cumpla en varios casos no prueba que sea verdadera para todos los n — para eso está la inducción. Pero que falle en un solo caso sí alcanza para probar que es falsa.</div>
  <h3>Practicá</h3>
  <details class="practice"><summary>¿Cómo demostrarías que la afirmación "todo entero de la forma n²+n es par" es verdadera, usando lo visto en este tema?</summary><div class="sol">Se puede probar con inducción (como en la Variación 3), o notando que n²+n = n(n+1), producto de dos enteros consecutivos, y entre dos consecutivos siempre hay uno par.</div></details>
  <details class="practice"><summary>Probá con n=1,2,3 si "n³+2 es siempre impar" y decidí si conviene buscar más contraejemplos o intentar demostrarla.</summary><div class="sol">n=1→3 (impar), n=2→10 (par) → ya encontraste un contraejemplo en n=2, la afirmación es falsa. No hace falta seguir probando.</div></details>

  <div class="tip-box"><span class="lbl">Antes de seguir</span><br>Estas tres variaciones (sumas, desigualdades, divisibilidad) son la base de la inducción matemática en matemática discreta. Para resolver un ejercicio nuevo, primero identificá qué tipo de expresión tenés (¿es una suma? ¿una desigualdad? ¿tenés que probar que algo es múltiplo de otra cosa?), aplicá los 3 pasos, y usá el álgebra (factorización, productos notables) para conectar la hipótesis con lo que necesitás probar.</div>
  `
},

  content:`
  <h3>Repaso rápido</h3>
  <p>Ya viste en "Conjuntos Numéricos" que un conjunto es una colección de elementos, que ∈ significa "pertenece a", y que un conjunto se puede definir por extensión (listando) o por comprensión (con una regla). Acá profundizamos en cómo <strong>operar</strong> con conjuntos.</p>

  <h3>Subconjuntos</h3>
  <p>A es <strong>subconjunto</strong> de B (A ⊆ B) si todo elemento de A también está en B. Si además existe algún elemento de B que no está en A, A es un <strong>subconjunto propio</strong> (A ⊂ B).</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>A={1,2}, B={1,2,3} → A ⊆ B y también A ⊂ B (propio). El conjunto vacío (∅) es subconjunto de cualquier conjunto.</p></div>

  <h3>Conjunto potencia</h3>
  <p>El <strong>conjunto potencia</strong> de A, escrito P(A), es el conjunto de <strong>todos</strong> los subconjuntos de A (incluyendo ∅ y el propio A). Si A tiene n elementos, P(A) tiene <strong>2ⁿ</strong> elementos.</p>
  <div class="example-box"><div class="lbl">Ejemplo: A={a,b}</div><p>P(A) = {∅, {a}, {b}, {a,b}} → tiene 2²=4 elementos.</p></div>

  <h3>Operaciones entre conjuntos</h3>
  <table style="width:100%;border-collapse:collapse;margin:10px 0;">
    <tr style="background:var(--paper-dim);"><th style="text-align:left;padding:8px;">Operación</th><th style="text-align:left;padding:8px;">Notación</th><th style="text-align:left;padding:8px;">Significado</th></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Unión</td><td style="padding:8px;border-top:1px solid var(--line);">A ∪ B</td><td style="padding:8px;border-top:1px solid var(--line);">Elementos que están en A, en B, o en ambos</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Intersección</td><td style="padding:8px;border-top:1px solid var(--line);">A ∩ B</td><td style="padding:8px;border-top:1px solid var(--line);">Elementos que están en A y en B a la vez</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Diferencia</td><td style="padding:8px;border-top:1px solid var(--line);">A − B</td><td style="padding:8px;border-top:1px solid var(--line);">Elementos de A que NO están en B</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Complemento</td><td style="padding:8px;border-top:1px solid var(--line);">A' (o Aᶜ)</td><td style="padding:8px;border-top:1px solid var(--line);">Elementos del universo U que no están en A</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Diferencia simétrica</td><td style="padding:8px;border-top:1px solid var(--line);">A △ B</td><td style="padding:8px;border-top:1px solid var(--line);">Elementos que están en A o en B, pero no en ambos</td></tr>
  </table>
  <div class="example-box"><div class="lbl">Ejemplo con A={1,2,3,4}, B={3,4,5,6}, U={1,...,8}</div><p>
  A∪B={1,2,3,4,5,6} &nbsp;·&nbsp; A∩B={3,4} &nbsp;·&nbsp; A−B={1,2} &nbsp;·&nbsp; A'={5,6,7,8} &nbsp;·&nbsp; A△B={1,2,5,6}</p></div>

  <h3>Diagramas de Venn</h3>
  <p>Son dibujos con círculos superpuestos que representan conjuntos dentro de un rectángulo (el universo U). Sirven para visualizar rápidamente cualquiera de las operaciones de arriba: la unión es "todo lo sombreado en cualquiera de los dos círculos", la intersección es "solo la zona donde se superponen", etc.</p>

  <h3>Producto cartesiano</h3>
  <p>A × B es el conjunto de <strong>todos los pares ordenados</strong> (a,b) donde a∈A y b∈B. Si A tiene m elementos y B tiene n, A×B tiene m·n elementos.</p>
  <div class="example-box"><div class="lbl">Ejemplo: A={1,2}, B={x,y}</div><p>A×B = {(1,x),(1,y),(2,x),(2,y)} → 2×2=4 pares. Ojo: A×B ≠ B×A en general (el orden dentro del par importa).</p></div>
  <div class="tip-box"><span class="lbl">Antes de seguir</span><br>El producto cartesiano es la base del próximo tema: una relación entre A y B no es más que un subconjunto de A×B.</div>

  <h3>Leyes de conjuntos</h3>
  <p>Son identidades que siempre se cumplen, sin importar qué conjuntos sean A, B o C. Las más importantes son las <strong>leyes de De Morgan</strong>, porque conectan complemento con unión/intersección:</p>
  <table style="width:100%;border-collapse:collapse;margin:10px 0;font-size:.92rem;">
    <tr style="background:var(--paper-dim);"><td style="padding:7px;">De Morgan</td><td style="padding:7px;">(A∪B)' = A'∩B' &nbsp;·&nbsp; (A∩B)' = A'∪B'</td></tr>
    <tr><td style="padding:7px;border-top:1px solid var(--line);">Distributiva</td><td style="padding:7px;border-top:1px solid var(--line);">A∩(B∪C) = (A∩B)∪(A∩C)</td></tr>
    <tr><td style="padding:7px;border-top:1px solid var(--line);">Asociativa</td><td style="padding:7px;border-top:1px solid var(--line);">(A∪B)∪C = A∪(B∪C)</td></tr>
    <tr><td style="padding:7px;border-top:1px solid var(--line);">Identidad</td><td style="padding:7px;border-top:1px solid var(--line);">A∪∅=A &nbsp;·&nbsp; A∩U=A</td></tr>
  </table>

  <h3>Cardinalidad y principio de inclusión-exclusión</h3>
  <p>|A| es el <strong>cardinal</strong> de A: la cantidad de elementos que tiene. Para calcular cuántos elementos tiene una unión, no se pueden sumar los cardinales directamente (se contarían dos veces los elementos compartidos):</p>
  <p class="formula">|A ∪ B| = |A| + |B| − |A ∩ B|</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>En un curso de 30 personas, 18 estudian inglés, 12 estudian francés, y 5 estudian ambos idiomas. ¿Cuántas estudian al menos uno?<br>|Inglés∪Francés| = 18+12−5 = <strong>25 personas</strong></p></div>

  <h3>Practicá</h3>
  <details class="practice"><summary>Con A={2,4,6,8}, B={4,8,12}, calculá A∩B y A∪B</summary><div class="sol">A∩B = {4,8} &nbsp;·&nbsp; A∪B = {2,4,6,8,12}</div></details>
  <details class="practice"><summary>¿Cuántos elementos tiene P(A) si A tiene 5 elementos?</summary><div class="sol">2⁵ = 32 subconjuntos</div></details>

  blurb:"Cómo se relacionan elementos entre conjuntos, sus propiedades, y las relaciones de equivalencia y de orden.",
  content:`
  <h3>¿Qué es una relación?</h3>
  <p>Una <strong>relación</strong> R de A en B es, formalmente, cualquier subconjunto de A×B (el producto cartesiano que viste en "Teoría de Conjuntos"). Si el par (a,b) está en R, se dice que "a está relacionado con b", y se escribe <strong>a R b</strong>.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>A={1,2,3}, B={x,y}. R = {(1,x),(2,x),(2,y)} es una relación de A en B: dice que 1 se relaciona con x, y que 2 se relaciona tanto con x como con y (a diferencia de una función, un elemento SÍ puede relacionarse con más de uno).</p></div>

  <h3>Formas de representar una relación</h3>
  <ul>
    <li><strong>Como conjunto de pares:</strong> la forma vista arriba, {(1,x),(2,x),(2,y)}.</li>
    <li><strong>Como matriz:</strong> filas = elementos de A, columnas = elementos de B, y se pone 1 si están relacionados, 0 si no.</li>
    <li><strong>Como dígrafo (diagrama de flechas):</strong> puntos para los elementos, y una flecha de a hacia b si a R b. Se usa sobre todo cuando A=B.</li>
  </ul>

  <h3>Dominio y rango</h3>
  <p>El <strong>dominio</strong> de R es el conjunto de todos los primeros elementos que aparecen en algún par; el <strong>rango</strong> (o imagen) es el conjunto de todos los segundos elementos.</p>
  <div class="example-box"><div class="lbl">Con R = {(1,x),(2,x),(2,y)}</div><p>Dominio = {1,2} &nbsp;·&nbsp; Rango = {x,y}</p></div>

  <h3>Propiedades de una relación en un conjunto (A=B)</h3>
  <p>Cuando una relación va de un conjunto a sí mismo, puede cumplir estas propiedades:</p>
  <table style="width:100%;border-collapse:collapse;margin:10px 0;">
    <tr style="background:var(--paper-dim);"><th style="text-align:left;padding:8px;">Propiedad</th><th style="text-align:left;padding:8px;">Condición</th><th style="text-align:left;padding:8px;">Ejemplo (en ℤ)</th></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Reflexiva</td><td style="padding:8px;border-top:1px solid var(--line);">a R a, para todo a</td><td style="padding:8px;border-top:1px solid var(--line);">a ≤ a siempre se cumple</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Simétrica</td><td style="padding:8px;border-top:1px solid var(--line);">si a R b, entonces b R a</td><td style="padding:8px;border-top:1px solid var(--line);">"a es hermano de b" → b es hermano de a</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Antisimétrica</td><td style="padding:8px;border-top:1px solid var(--line);">si a R b y b R a, entonces a=b</td><td style="padding:8px;border-top:1px solid var(--line);">a ≤ b y b ≤ a → a=b</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Transitiva</td><td style="padding:8px;border-top:1px solid var(--line);">si a R b y b R c, entonces a R c</td><td style="padding:8px;border-top:1px solid var(--line);">a ≤ b y b ≤ c → a ≤ c</td></tr>
  </table>
  <div class="tip-box"><span class="lbl">Cómo comprobarlas</span><br>Para verificar cada propiedad, buscá un contraejemplo: si encontrás UN caso donde falla, la relación NO cumple esa propiedad (misma lógica que la demostración por contraejemplo del tema "Demostraciones").</div>
  <div class="example-box"><div class="lbl">Ejemplo: R = "a divide a b" sobre los enteros positivos</div><p>Reflexiva: a∣a siempre (✓). Antisimétrica: si a∣b y b∣a, entonces a=b (✓). Transitiva: si a∣b y b∣c, entonces a∣c (✓, es la propiedad transitiva que ya viste en Divisibilidad). NO es simétrica: 2∣4 pero 4∤2.</p></div>

  <h3>Relación de equivalencia</h3>
  <p>Es una relación que es <strong>reflexiva, simétrica y transitiva</strong> a la vez. Estas relaciones "agrupan" los elementos en <strong>clases de equivalencia</strong>: subconjuntos donde todos los elementos están relacionados entre sí.</p>
  <div class="example-box"><div class="lbl">Ejemplo: congruencia módulo n</div><p>a R b si a mod n = b mod n (ya viste el módulo en "Matemática Modular"). Es reflexiva, simétrica y transitiva → es relación de equivalencia. Con n=3, la clase de equivalencia del 1 es {...,−5,−2,1,4,7,...}: todos los enteros que dejan resto 1 al dividir por 3.</p></div>

  <h3>Relación de orden parcial</h3>
  <p>Es una relación <strong>reflexiva, antisimétrica y transitiva</strong>. Permite "ordenar" elementos, aunque no siempre se puedan comparar todos entre sí (por eso es "parcial").</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>La relación ≤ sobre los números es un orden (de hecho, es un orden <em>total</em>, porque cualquier par de números se puede comparar). La relación "a divide a b" sobre los enteros positivos también es un orden, pero parcial: 2 y 3 no se dividen entre sí, así que no son comparables.</p></div>

  <h3>Composición de relaciones</h3>
  <p>Si R va de A en B y S va de B en C, la composición S∘R va de A en C: a (S∘R) c si existe algún b∈B tal que a R b y b S c. Es la misma idea que la composición de funciones, aplicada a relaciones.</p>

  <h3>Practicá</h3>
  <details class="practice"><summary>¿La relación "a R b si a+b es par" sobre los enteros, es reflexiva? ¿simétrica?</summary><div class="sol">Reflexiva: a+a=2a, siempre par (✓). Simétrica: si a+b es par, b+a también (✓, la suma es conmutativa).</div></details>
  <details class="practice"><summary>Dado R={(1,2),(2,3),(1,3)} sobre {1,2,3}, ¿es transitiva?</summary><div class="sol">Sí: el único caso a chequear es 1R2 y 2R3, que exige que 1R3 esté — y está.</div></details>
  <details class="practice"><summary>¿"a R b si a es hermano de b" es una relación de equivalencia?</summary><div class="sol">Es simétrica, y transitiva en general, pero NO es reflexiva (nadie es hermano de sí mismo) → no es de equivalencia tal como está definida.</div></details>
  `
},
{
  id:"funciones-discretas",
  num:19,
  title:"Funciones: Inyectividad, Sobreyectividad y Biyectividad",
  diff:"media-alta",
  diffLabel:"Media / Alta",
  blurb:"El enfoque de matemática discreta sobre funciones: cuándo son uno a uno, cuándo cubren todo el codominio, y aplicaciones de conteo.",
  content:`
  <h3>Repaso: función como relación especial</h3>
  <p>Ya viste qué es una función en "Funciones: Fundamentos". Formalmente, una función f: A→B es una <strong>relación</strong> de A en B (un subconjunto de A×B) donde cada elemento de A aparece en <strong>exactamente un</strong> par — a diferencia de una relación cualquiera, donde un elemento puede relacionarse con varios o con ninguno.</p>

  <h3>Función inyectiva (uno a uno)</h3>
  <p>f es <strong>inyectiva</strong> si elementos distintos del dominio siempre dan salidas distintas: nunca dos entradas comparten la misma salida.</p>
  <p class="formula">f es inyectiva ⟺ f(a)=f(b) implica a=b</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>f(x)=2x+1 sobre los reales es inyectiva (cada salida viene de una única entrada). g(x)=x² sobre los reales NO es inyectiva: g(2)=4 y g(−2)=4, dos entradas distintas dan la misma salida.</p></div>

  <h3>Función sobreyectiva (suprayectiva)</h3>
  <p>f: A→B es <strong>sobreyectiva</strong> si todo elemento de B es la salida de al menos un elemento de A: el rango coincide exactamente con el codominio completo.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>f: ℝ→ℝ, f(x)=x³ es sobreyectiva (todo real es el cubo de algún real). g: ℝ→ℝ, g(x)=x² NO es sobreyectiva (los números negativos nunca se alcanzan, porque un cuadrado nunca da negativo).</p></div>

  <h3>Función biyectiva</h3>
  <p>Es <strong>inyectiva y sobreyectiva</strong> a la vez. Solo las funciones biyectivas tienen una función inversa que también es función (esto ya lo viste en "Funciones").</p>
  <div class="example-box"><div class="lbl">Ejemplo con conjuntos finitos</div><p>A={1,2,3}, B={x,y,z}. f={(1,x),(2,y),(3,z)} es biyectiva: cada elemento de A va a uno distinto de B, y los tres elementos de B quedan cubiertos.</p></div>
  <div class="tip-box"><span class="lbl">Truco para conjuntos finitos</span><br>Si A y B son finitos con el mismo número de elementos, una función f:A→B es biyectiva si y solo si es inyectiva (o, equivalentemente, si y solo si es sobreyectiva) — con la misma cantidad de elementos, una propiedad garantiza la otra.</div>

  <h3>Funciones piso y techo</h3>
  <p>Muy usadas en matemática discreta y programación:</p>
  <p class="formula">⌊x⌋ (piso) = el mayor entero menor o igual a x &nbsp;&nbsp; ⌈x⌉ (techo) = el menor entero mayor o igual a x</p>
  <div class="example-box"><div class="lbl">Ejemplos</div><p>⌊3.7⌋=3 &nbsp;·&nbsp; ⌈3.7⌉=4 &nbsp;·&nbsp; ⌊5⌋=5 (si ya es entero, queda igual) &nbsp;·&nbsp; ⌊−2.3⌋=−3 (ojo: el piso de un negativo "redondea hacia abajo", no hacia 0) &nbsp;·&nbsp; ⌈−2.3⌉=−2</p></div>

  <h3>Imagen y preimagen de un conjunto</h3>
  <p>Dada f:A→B y un subconjunto S⊆A, la <strong>imagen</strong> de S es el conjunto de todas las salidas que produce f al aplicarla a los elementos de S: f(S)={f(x) : x∈S}. Al revés, dado un subconjunto T⊆B, la <strong>preimagen</strong> de T es el conjunto de todas las entradas que caen en T: f⁻¹(T)={x∈A : f(x)∈T} (esto tiene sentido aunque f no sea biyectiva, a diferencia de la función inversa).</p>
  <div class="example-box"><div class="lbl">Ejemplo con f(x)=x², f:ℝ→ℝ</div><p>f({1,2,3}) = {1,4,9} (la imagen del conjunto {1,2,3}). f⁻¹({4,9}) = {−3,−2,2,3} (todos los x tales que x² sea 4 o 9).</p></div>

  <h3>¿Cuántas funciones hay entre dos conjuntos finitos?</h3>
  <p>Si A tiene n elementos y B tiene m elementos, se puede contar exactamente cuántas funciones, funciones inyectivas y biyecciones existen de A en B:</p>
  <table style="width:100%;border-collapse:collapse;margin:10px 0;">
    <tr style="background:var(--paper-dim);"><th style="text-align:left;padding:8px;">¿Qué se cuenta?</th><th style="text-align:left;padding:8px;">Fórmula</th></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Funciones de A en B (todas)</td><td style="padding:8px;border-top:1px solid var(--line);">mⁿ</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Funciones inyectivas de A en B (con n≤m)</td><td style="padding:8px;border-top:1px solid var(--line);">m!/(m−n)!</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Biyecciones (con n=m)</td><td style="padding:8px;border-top:1px solid var(--line);">n!</td></tr>
  </table>
  <div class="example-box"><div class="lbl">Ejemplo: A={1,2,3}, B={x,y}</div><p>Cantidad total de funciones de A en B: 2³=8 (cada uno de los 3 elementos de A elige libremente entre 2 salidas). Ninguna puede ser inyectiva, porque A tiene más elementos que B.</p></div>
  <div class="tip-box"><span class="lbl">Por qué "mⁿ" y no "nᵐ"</span><br>Cada uno de los n elementos del dominio A elige, de forma independiente, una de las m salidas posibles en B. Por el principio del producto (que vas a ver formalmente en el próximo tema), eso da m×m×...×m (n veces) = mⁿ.</div>

  <h3>Principio del palomar (pigeonhole)</h3>
  <p>Si tenés que ubicar más objetos que "casillas" disponibles, entonces al menos una casilla va a tener más de un objeto. Formalmente: si f:A→B con |A|>|B|, entonces f no puede ser inyectiva.</p>
  <div class="example-box"><div class="lbl">Ejemplo clásico</div><p>En un grupo de 13 personas, siempre hay al menos dos que cumplen años el mismo mes (12 meses = 12 "casillas", 13 personas = 13 "objetos").</p></div>
  <div class="example-box"><div class="lbl">Versión general</div><p>Si se reparten n objetos en k casillas, alguna casilla tiene al menos ⌈n/k⌉ objetos. Con 100 personas y 12 meses: ⌈100/12⌉=9, así que algún mes tiene al menos 9 cumpleañeros.</p></div>

  content:`
  <h3>Principio de la suma</h3>
  <p>Si una tarea se puede hacer de m formas O de n formas (sin superposición entre ambas opciones), entonces se puede hacer de <strong>m+n</strong> formas en total.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Un menú tiene 4 platos de carne o 3 platos vegetarianos. Si elegís uno cualquiera: 4+3=<strong>7 opciones</strong>.</p></div>

  <h3>Principio del producto</h3>
  <p>Si una tarea tiene varios pasos independientes, y el primero se puede hacer de m formas, el segundo de n formas (sin importar qué se eligió antes), entonces la tarea completa se puede hacer de <strong>m·n</strong> formas.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Un local tiene 5 sabores de helado y 3 tipos de cucurucho. Combinaciones posibles: 5×3=<strong>15</strong>.</p></div>
  <div class="tip-box"><span class="lbl">Cómo distinguirlos</span><br>Suma: elegís UNA cosa entre varias categorías separadas ("esto O aquello"). Producto: armás algo combinando varias decisiones seguidas ("esto Y también aquello").</div>

  <h3>Permutaciones (el orden importa)</h3>
  <p>Una <strong>permutación</strong> es un arreglo ordenado de elementos. La cantidad de formas de ordenar n elementos distintos, tomando r de ellos:</p>
  <p class="formula">P(n,r) = n! / (n−r)!</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>¿De cuántas formas se pueden ubicar 3 de 5 personas en el podio (1°,2°,3°)? P(5,3) = 5!/2! = 120/2 = <strong>60</strong></p></div>
  <p>Si r=n (usás todos los elementos), P(n,n)=n!.</p>
  <div class="tip-box"><span class="lbl">Permutaciones con repetición</span><br>Si hay elementos repetidos en un total de n, y se repiten n₁, n₂... veces cada uno, la cantidad de arreglos distintos es n!/(n₁!·n₂!·...). Ej: las letras de "BANANA" (6 letras, con 3 A's y 2 N's) se pueden ordenar de 6!/(3!·2!)=60 formas distintas.</p></div>

  <h3>Combinaciones (el orden NO importa)</h3>
  <p>Una <strong>combinación</strong> es una selección de elementos donde el orden no importa (un grupo, no una fila). La cantidad de formas de elegir r elementos de un total de n:</p>
  <p class="formula">C(n,r) = n! / (r!·(n−r)!) &nbsp;&nbsp; (también se escribe (ⁿᵣ), "n sobre r")</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>¿De cuántas formas se puede elegir un comité de 3 personas entre 8? Acá el orden no importa (es un grupo, no cargos distintos): C(8,3) = 8!/(3!·5!) = <strong>56</strong></p></div>
  <div class="tip-box"><span class="lbl">Permutación vs. combinación: la pregunta clave</span><br>¿Importa el orden en el que quedan los elementos elegidos? Si sí (como en un podio, una contraseña, una fila) → permutación. Si no (como en un comité, una mano de cartas, un grupo) → combinación.</div>

  <h3>Permutaciones y combinaciones con repetición</h3>
  <p>Todo lo anterior asumía elementos que no se repiten. Cuando SÍ se permite repetir, las fórmulas cambian:</p>
  <div class="tip-box"><span class="lbl">Permutaciones con repetición (el orden importa, y se puede repetir)</span><br>Si hay n opciones posibles y elegís r veces (pudiendo repetir cada vez), hay <strong>nʳ</strong> resultados posibles — es directamente el principio del producto aplicado r veces.</div>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>¿Cuántas contraseñas de 4 dígitos (0-9) existen, permitiendo repetir dígitos? 10⁴ = <strong>10 000</strong></p></div>
  <div class="tip-box"><span class="lbl">Combinaciones con repetición (el orden NO importa, y se puede repetir)</span><br>Si elegís r elementos de un total de n tipos distintos, permitiendo repetir tipos y sin importar el orden:</div>
  <p class="formula">C(n+r−1, r) = (n+r−1)! / (r!·(n−1)!)</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>En una heladería con 5 sabores, ¿de cuántas formas se pueden elegir 3 bochas, permitiendo repetir sabor (y sin importar el orden en que se sirven)? C(5+3−1,3) = C(7,3) = 7!/(3!·4!) = <strong>35</strong></p></div>
  <div class="tip-box"><span class="lbl">Cómo distinguir las 4 variantes de conteo</span><br>Preguntate dos cosas: (1) ¿importa el orden? (2) ¿se puede repetir? Sin repetición y con orden → permutación P(n,r). Sin repetición y sin orden → combinación C(n,r). Con repetición y con orden → nʳ. Con repetición y sin orden → C(n+r−1,r).</div>

  <h3>Triángulo de Pascal y binomio de Newton</h3>
  <p>Los valores de C(n,r) forman el triángulo de Pascal, donde cada número es la suma de los dos de arriba. Estos mismos números son los coeficientes al expandir una potencia de un binomio:</p>
  <p class="formula">(a+b)ⁿ = Σ(r=0 hasta n) C(n,r)·aⁿ⁻ʳ·bʳ</p>
  <div class="example-box"><div class="lbl">Ejemplo: (a+b)³</div><p>C(3,0)a³+C(3,1)a²b+C(3,2)ab²+C(3,3)b³ = a³+3a²b+3ab²+b³ (coincide con el cubo de binomio que ya conocés)</p></div>

  <h3>Probabilidad básica</h3>
  <p>El <strong>espacio muestral</strong> S es el conjunto de todos los resultados posibles de un experimento. Un <strong>evento</strong> A es cualquier subconjunto de S. Si todos los resultados son igual de probables:</p>
  <p class="formula">P(A) = |A| / |S| = casos favorables / casos totales</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Al tirar un dado, S={1,2,3,4,5,6}. Evento A="sale número par"={2,4,6}. P(A)=3/6=<strong>1/2</strong></p></div>

  <h3>Combinando probabilidades</h3>
  <ul>
    <li><strong>Eventos mutuamente excluyentes</strong> (no pueden pasar los dos a la vez): P(A∪B) = P(A)+P(B)</li>
    <li><strong>Eventos no excluyentes:</strong> P(A∪B) = P(A)+P(B)−P(A∩B) (la misma idea de inclusión-exclusión de "Teoría de Conjuntos")</li>
    <li><strong>Eventos independientes</strong> (uno no afecta al otro): P(A∩B) = P(A)·P(B)</li>
  </ul>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Se tira una moneda y un dado. P(cara Y sale 6) = P(cara)·P(6) = (1/2)(1/6) = <strong>1/12</strong> (son independientes).</p></div>

  <div class="tip-box"><span class="lbl">Antes de seguir</span><br>Estas herramientas de conteo se usan mucho en teoría de números (para contar cuántos números cumplen cierta propiedad) y en grafos (para contar caminos o coloreos posibles) — los próximos dos temas.</div>

  <h3>Practicá</h3>
  <details class="practice"><summary>¿De cuántas formas se pueden ordenar 4 libros distintos en un estante?</summary><div class="sol">P(4,4) = 4! = <strong>24</strong></div></details>

  `
},

  content:`
  <h3>Repaso rápido</h3>
  <p>Ya viste divisibilidad, números primos, M.C.D., m.c.m. y el operador módulo en temas anteriores. Este tema construye sobre esas bases para llegar a herramientas usadas en programación y criptografía.</p>

  <h3>Congruencia módulo n</h3>
  <p>Dos enteros a y b son <strong>congruentes módulo n</strong> si tienen el mismo resto al dividirlos por n (equivalentemente, si n divide a su diferencia). Se escribe:</p>
  <p class="formula">a ≡ b (mod n) &nbsp;⟺&nbsp; n ∣ (a−b)</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>17 ≡ 5 (mod 6), porque 17−5=12, y 6∣12. (También: 17 mod 6=5 y 5 mod 6=5, mismo resto.)</p></div>
  <p>Las congruencias se comportan como una igualdad para sumar, restar y multiplicar: si a≡b (mod n) y c≡d (mod n), entonces a+c≡b+d (mod n) y a·c≡b·d (mod n).</p>
  <div class="example-box"><div class="lbl">Aplicación: calcular restos de potencias grandes</div><p>¿Cuánto es 7¹⁰⁰ mod 5? Como 7≡2 (mod 5), entonces 7¹⁰⁰≡2¹⁰⁰ (mod 5). Las potencias de 2 mod 5 se repiten en ciclo: 2,4,3,1,2,4,3,1... (período 4). Como 100 es múltiplo de 4, 2¹⁰⁰≡1 (mod 5) → <strong>7¹⁰⁰ mod 5 = 1</strong></p></div>

  <h3>Identidad de Bézout</h3>
  <p>Para cualquier par de enteros a y b, siempre existen enteros x e y tales que:</p>
  <p class="formula">a·x + b·y = M.C.D.(a,b)</p>
  <p>Estos x e y se pueden encontrar "deshaciendo" los pasos del algoritmo de Euclides (que ya viste en "Inducción y Divisibilidad") de atrás para adelante.</p>
  <div class="example-box"><div class="lbl">Ejemplo con a=18, b=5</div><p>Euclides: 18=3(5)+3 &nbsp;·&nbsp; 5=1(3)+2 &nbsp;·&nbsp; 3=1(2)+1 &nbsp;·&nbsp; 2=2(1)+0 → M.C.D.=1<br>Deshaciendo: 1=3−1(2) = 3−1(5−1(3)) = 2(3)−1(5) = 2(18−3(5))−1(5) = 2(18)−7(5)<br>→ x=2, y=−7: 18(2)+5(−7) = 36−35 = <strong>1</strong> ✓</p></div>

  <h3>Inverso multiplicativo módulo n</h3>
  <p>El inverso de a módulo n es un entero a⁻¹ tal que a·a⁻¹ ≡ 1 (mod n). Existe <strong>solo si</strong> M.C.D.(a,n)=1 (es decir, si a y n son coprimos), y se encuentra con la identidad de Bézout: si a·x+n·y=1, entonces x es el inverso de a módulo n.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Del cálculo anterior, 18(2)+5(−7)=1, entonces 18≡3 (mod 5), así que 3·2=6≡1 (mod 5) → <strong>el inverso de 3 módulo 5 es 2</strong>.</p></div>

  <h3>Pequeño Teorema de Fermat</h3>
  <p>Si p es un número primo y a no es múltiplo de p, entonces:</p>

  <div class="example-box"><div class="lbl">Ejemplo con p=7, a=3</div><p>3⁶ mod 7 debería dar 1: 3⁶=729, y 729=104×7+1 → 729 mod 7=<strong>1</strong> ✓ (coincide con lo que predice el teorema)</p></div>
  <div class="tip-box"><span class="lbl">Para qué sirve</span><br>Este teorema permite calcular restos de potencias enormes sin hacer la cuenta completa, y es la base matemática de tests de primalidad y de sistemas de cifrado como RSA.</div>

  <h3>Una mirada a la criptografía: la idea de RSA</h3>
  <p>RSA es un sistema de cifrado (usado, por ejemplo, para proteger conexiones web) basado en que <strong>multiplicar dos primos grandes es fácil, pero factorizar el resultado es extremadamente difícil</strong> sin conocer los primos originales. Se eligen dos primos grandes p y q, se calcula n=p·q, y las operaciones de cifrado/descifrado usan congruencias módulo n y el inverso multiplicativo — las mismas herramientas que acabás de ver. La seguridad depende de que factorizar n (recuperar p y q) sea computacionalmente inviable con números suficientemente grandes.</p>

  <h3>Practicá</h3>

  <details class="practice"><summary>Usando Fermat, ¿cuánto es 5¹⁰ mod 11?</summary><div class="sol">11 es primo, entonces 5¹⁰≡1 (mod 11) por el Pequeño Teorema de Fermat.</div></details>
  `
