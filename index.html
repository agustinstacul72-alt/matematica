{
  id:"grafos-arboles",
  num:22,
  title:"Grafos y Árboles",
  diff:"alta",
  diffLabel:"Alta",
  blurb:"Vértices, aristas, caminos y circuitos de Euler y Hamilton, coloreado, y la estructura especial de los árboles.",
  content:`
  <h3>¿Qué es un grafo?</h3>
  <p>Un <strong>grafo</strong> G=(V,E) es un conjunto de <strong>vértices</strong> (o nodos) V, junto con un conjunto de <strong>aristas</strong> E que conectan pares de vértices. Sirve para modelar redes: rutas entre ciudades, conexiones entre computadoras, amistades en una red social, tareas con dependencias, etc.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>V={A,B,C,D}, E={(A,B),(B,C),(C,D),(A,D)}: cuatro vértices conectados en forma de "cuadrado".</p></div>

  <h3>Grafos dirigidos y no dirigidos</h3>
  <p>En un grafo <strong>no dirigido</strong>, la arista (A,B) es la misma que (B,A) (la conexión no tiene sentido, como una calle de doble mano). En un grafo <strong>dirigido</strong> (o dígrafo), las aristas tienen sentido: (A,B) es distinta de (B,A) (como una calle de una sola mano).</p>

  <h3>Grado de un vértice</h3>
  <p>El <strong>grado</strong> de un vértice es la cantidad de aristas que tocan a ese vértice (en un dígrafo se distingue grado de entrada y grado de salida).</p>
  <div class="tip-box"><span class="lbl">Lema del apretón de manos (handshake lemma)</span><br>La suma de los grados de todos los vértices es siempre el doble de la cantidad de aristas, porque cada arista aporta 1 al grado de cada uno de sus dos extremos:</div>
  <p class="formula">Σ grado(v) = 2|E|</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>En el grafo de arriba, cada vértice tiene grado 2 (A-B, A-D; B-A, B-C; etc.), suma total = 4×2=8, y efectivamente 2|E|=2×4=8. ✓</p></div>

  <h3>Tipos de grafos</h3>
  <table style="width:100%;border-collapse:collapse;margin:10px 0;">
    <tr style="background:var(--paper-dim);"><th style="text-align:left;padding:8px;">Tipo</th><th style="text-align:left;padding:8px;">Descripción</th></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Simple</td><td style="padding:8px;border-top:1px solid var(--line);">Sin aristas repetidas ni lazos (arista de un vértice a sí mismo)</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Completo (Kₙ)</td><td style="padding:8px;border-top:1px solid var(--line);">Todo par de vértices está conectado. Tiene n(n−1)/2 aristas</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Bipartito</td><td style="padding:8px;border-top:1px solid var(--line);">Los vértices se dividen en 2 grupos, y las aristas solo van de un grupo al otro (nunca dentro del mismo)</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Ponderado</td><td style="padding:8px;border-top:1px solid var(--line);">Cada arista tiene un "peso" o costo numérico asociado (ej: distancia en km)</td></tr>
  </table>

  <h3>Caminos, ciclos y conectividad</h3>
  <p>Un <strong>camino</strong> es una secuencia de vértices donde cada uno está conectado con el siguiente por una arista. Un <strong>ciclo</strong> es un camino que empieza y termina en el mismo vértice, sin repetir aristas. Un grafo es <strong>conexo</strong> si existe un camino entre cualquier par de vértices.</p>

  <h3>Caminos y circuitos de Euler</h3>
  <p>Un <strong>camino de Euler</strong> es un camino que recorre <strong>cada arista del grafo exactamente una vez</strong> (puede repetir vértices). Un <strong>circuito de Euler</strong> es un camino de Euler que además empieza y termina en el mismo vértice.</p>
  <div class="tip-box"><span class="lbl">Cómo saber si existen, sin dibujar nada</span><br>
  • Un grafo conexo tiene <strong>circuito</strong> de Euler ⟺ todos sus vértices tienen grado <strong>par</strong>.<br>
  • Un grafo conexo tiene <strong>camino</strong> de Euler (sin ser circuito) ⟺ tiene exactamente <strong>0 o 2</strong> vértices de grado impar.</div>
  <div class="example-box"><div class="lbl">El problema original: los puentes de Königsberg</div><p>En 1736, Leonhard Euler demostró que era imposible cruzar los 7 puentes de la ciudad pasando por cada uno exactamente una vez y volviendo al punto de partida. Al modelar las 4 zonas de tierra como vértices y los puentes como aristas, los 4 vértices resultaron tener grado impar — muchos más de los 2 permitidos para un simple camino de Euler, y muy lejos de los "todos pares" que exige un circuito. Este problema es considerado el origen de la teoría de grafos.</p></div>

  <h3>Caminos y circuitos de Hamilton</h3>
  <p>Un <strong>camino de Hamilton</strong> pasa por <strong>cada vértice del grafo exactamente una vez</strong> (no importa si deja aristas sin usar). Un <strong>circuito de Hamilton</strong> es un camino de Hamilton que vuelve al vértice de partida.</p>
  <div class="tip-box"><span class="lbl">Ojo con la diferencia</span><br>Euler se preocupa por no repetir ARISTAS (y puede repetir vértices); Hamilton se preocupa por no repetir VÉRTICES (y puede dejar aristas sin usar). A diferencia de Euler, no existe una regla simple para saber si un grafo tiene camino o circuito de Hamilton — hay que buscarlo o descartarlo caso por caso.</p></div>

  <h3>Coloreado de grafos</h3>
  <p>Colorear un grafo significa asignarle un color a cada vértice de forma que <strong>dos vértices conectados por una arista nunca tengan el mismo color</strong>. El <strong>número cromático</strong> de un grafo es la menor cantidad de colores con la que esto es posible.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Un grafo bipartito siempre tiene número cromático 2 (los dos grupos se pintan cada uno de un color). Un grafo completo Kₙ necesita n colores (todos los vértices son vecinos entre sí).</p></div>
  <div class="tip-box"><span class="lbl">El teorema de los cuatro colores</span><br>Cualquier mapa dibujado en un plano (donde los países son regiones y dos países son "vecinos" si comparten frontera) siempre se puede colorear con, como máximo, <strong>4 colores</strong>, sin que dos países vecinos compartan color. Es uno de los teoremas más famosos de la matemática: se conjeturó en 1852 y recién se demostró en 1976, con ayuda de una computadora.</div>

  <h3>Representación de grafos</h3>
  <ul>
    <li><strong>Matriz de adyacencia:</strong> una tabla de n×n donde la celda (i,j) vale 1 si hay arista entre i y j, y 0 si no.</li>
    <li><strong>Lista de adyacencia:</strong> para cada vértice, una lista de los vértices con los que está conectado. Suele ser más eficiente cuando hay pocas conexiones.</li>
  </ul>

  <h3>Árboles</h3>
  <p>Un <strong>árbol</strong> es un grafo <strong>conexo y sin ciclos</strong>. Los árboles son la estructura detrás de jerarquías (organigramas, sistemas de archivos, árboles genealógicos, árboles de decisión).</p>
  <div class="tip-box"><span class="lbl">Propiedad clave</span><br>Un árbol con n vértices tiene <strong>exactamente n−1 aristas</strong> — ni una más, ni una menos. Si tuviera más, formaría un ciclo; si tuviera menos, no sería conexo.</div>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Un árbol con 6 vértices tiene exactamente 5 aristas.</p></div>

  <h3>Árbol de expansión (spanning tree)</h3>
  <p>Dado un grafo conexo G, un <strong>árbol de expansión</strong> es un subgrafo que incluye <strong>todos</strong> los vértices de G, conectados con la <strong>menor cantidad posible</strong> de aristas (sin ciclos) — es decir, "podar" aristas sobrantes hasta quedarse con un árbol.</p>

  <h3>Recorridos de un grafo</h3>
  <p>Para visitar todos los vértices de un grafo de forma sistemática, hay dos estrategias clásicas:</p>
  <ul>
    <li><strong>BFS (recorrido en anchura):</strong> visita primero todos los vecinos directos del punto de partida, y recién después los vecinos de esos vecinos, nivel por nivel.</li>
    <li><strong>DFS (recorrido en profundidad):</strong> avanza todo lo posible por un camino antes de retroceder y probar otro.</li>
  </ul>

  <h3>Recorridos en árboles binarios</h3>

  content:`
  <h3>Tipos de igualdad</h3>
  <ul>
    <li><strong>Ecuación:</strong> se cumple solo para valores específicos. Ej: 3x-12=0 solo se cumple si x=4</li>
    <li><strong>Fórmula:</strong> se cumple para todos los valores de las variables. Ej: D=v·t</li>
    <li><strong>Identidad:</strong> los dos lados son exactamente lo mismo, para cualquier valor. Ej: sen²x + cos²x = 1</li>
    <li><strong>Equivalencia:</strong> ambos lados valen lo mismo tras operar. Ej: 5x = 3x+2x</li>
  </ul>

  <h3>Desigualdad</h3>
  <p>Usa los símbolos &lt;, &gt;, ≤, ≥ en vez del signo igual. A diferencia de una ecuación (que suele tener soluciones puntuales), una desigualdad normalmente tiene <strong>infinitas soluciones</strong>, que forman un intervalo.</p>
  <div class="example-box"><div class="lbl">Comparación</div><p>Ecuación: 4x+7=19 → solución: x=3 (un solo punto)<br>Desigualdad: 4x+7≤19 → solución: x≤3 (todo un intervalo: (-∞,3])</p></div>

  <h3>Tipos de desigualdad</h3>
  <ul>
    <li><strong>Absoluta:</strong> no depende de las variables, siempre es verdadera. Ej: 7&gt;5, (a+b)²≥0</li>
    <li><strong>Condicional (inecuación):</strong> se cumple solo para ciertos valores. Ej: 3x &lt; x²-5</li>
  </ul>

  <h3>Las 5 propiedades para operar con desigualdades</h3>
  <table style="width:100%;border-collapse:collapse;font-size:.94rem;">
  <tr style="background:var(--paper-dim);"><td style="padding:7px;">Sumar/restar lo mismo</td><td style="padding:7px;">A≤B ⟺ A+C≤B+C</td></tr>
  <tr><td style="padding:7px;border-top:1px solid var(--line);">Multiplicar por positivo</td><td style="padding:7px;border-top:1px solid var(--line);">Si C&gt;0: A≤B ⟺ AC≤BC</td></tr>
  <tr><td style="padding:7px;border-top:1px solid var(--line);"><strong>Multiplicar por negativo</strong></td><td style="padding:7px;border-top:1px solid var(--line);"><strong>Si C&lt;0: A≤B ⟺ AC≥BC (¡se invierte!)</strong></td></tr>
  <tr><td style="padding:7px;border-top:1px solid var(--line);">Tomar recíprocos (positivos)</td><td style="padding:7px;border-top:1px solid var(--line);">A≤B ⟺ 1/A≥1/B</td></tr>
  <tr><td style="padding:7px;border-top:1px solid var(--line);">Sumar desigualdades</td><td style="padding:7px;border-top:1px solid var(--line);">Si A≤B y C≤D: A+C≤B+D</td></tr>
  </table>
  <div class="tip-box"><span class="lbl">El error más común</span><br>Cuando multiplicás o dividís una desigualdad por un número <strong>negativo</strong>, el signo se da vuelta. Ej: si -2x &lt; 6, al dividir por -2 queda x &gt; -3 (no x &lt; -3).</div>

  <h3>Resolver una desigualdad lineal</h3>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>3x + 11 ≤ 6x + 8 → 11-8 ≤ 6x-3x → 3 ≤ 3x → 1 ≤ x → x ∈ [1, ∞)</p></div>

  <h3>Resolver una desigualdad no lineal (5 pasos)</h3>
  <ol>
    <li>Pasar todo a un lado (dejar 0 del otro)</li>

  <h3>Ejemplo 1: Alquiler de auto</h3>
  <div class="example-box">
  <div class="lbl">Problema</div>
  <p>Una empresa cobra $30 por día más $0.15 por milla. Helen alquila un auto por 2 días y paga $108. ¿Cuántas millas recorrió?</p>
  <p><strong>1. Variable:</strong> x = millas recorridas<br>
  <strong>2. En álgebra:</strong> costo por millas = 0.15x, costo por días = 2(30)=60<br>
  <strong>3. Modelo:</strong> 0.15x + 60 = 108<br>
  <strong>4. Resolver:</strong> 0.15x = 48 → x = 48/0.15 = <strong>320 millas</strong></p>
  </div>

  <h3>Ejemplo 2: Interés sobre una inversión</h3>
  <div class="example-box">
  <div class="lbl">Problema</div>
  <p>María invierte $100.000 en dos certificados: uno al 6% y otro al 4.5% anual. Gana $5025 de interés total. ¿Cuánto invirtió en cada uno?</p>
  <p><strong>1. Variable:</strong> x = cantidad invertida al 6% (entonces 100.000-x es lo invertido al 4.5%)<br>
  <strong>2. En álgebra:</strong> interés al 6% = 0.06x, interés al 4.5% = 0.045(100.000-x)<br>
  <strong>3. Modelo:</strong> 0.06x + 0.045(100.000-x) = 5025<br>
  <strong>4. Resolver:</strong> 0.015x + 4500 = 5025 → x = 525/0.015 = <strong>$35.000 al 6% y $65.000 al 4.5%</strong></p>
  </div>

  <h3>Tips por tipo de problema</h3>
  <ul>
    <li><strong>Números consecutivos:</strong> llamá n al primero, n+1 al segundo, n+2 al tercero...</li>
    <li><strong>Inversiones / porcentajes:</strong> "tasa × cantidad" es el interés o la parte proporcional.</li>
    <li><strong>Velocidad / tiempo / distancia:</strong> distancia = velocidad × tiempo.</li>

  </ul>

  <div class="tip-box"><span class="lbl">Antes de resolver</span><br>Este tema junta TODO lo anterior: necesitás leer bien (comprensión), traducir a álgebra (expresiones algebraicas), y resolver la ecuación resultante (ecuaciones, y a veces desigualdades).</div>

  `

  <h3>¿Qué es la geometría de coordenadas?</h3>
  <p>También llamada geometría analítica o cartesiana. Es el área que permite representar puntos, rectas, curvas y figuras en un plano usando coordenadas (números), y no solo dibujos a mano. La herramienta central es el <strong>plano cartesiano</strong>.</p>

  <h3>El plano cartesiano</h3>
  <p>Tiene dos ejes perpendiculares (a 90°): el eje <strong>X</strong> (horizontal, izquierda-derecha) y el eje <strong>Y</strong> (vertical, arriba-abajo). Se cruzan en el <strong>origen</strong>, el punto O = (0,0).</p>
  <p>Un punto se ubica con un par ordenado (x,y): x indica cuánto moverse desde el origen hacia la derecha (positivo) o izquierda (negativo), e y indica cuánto moverse hacia arriba (positivo) o abajo (negativo).</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>El punto (3,2) está 3 posiciones a la derecha del origen y 2 hacia arriba. El punto (-2,-5) está 2 a la izquierda y 5 hacia abajo.</p></div>

  <h3>Cuadrantes</h3>
  <p>Los dos ejes dividen el plano en 4 regiones, numeradas del I al IV en sentido contrario a las agujas del reloj, empezando arriba a la derecha:</p>
  <table style="width:100%;border-collapse:collapse;margin:12px 0;text-align:center;">
    <tr style="background:var(--paper-dim);"><td style="padding:8px;">Cuadrante</td><td style="padding:8px;">Signo de (x,y)</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">I</td><td style="padding:8px;border-top:1px solid var(--line);">(+,+)</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">II</td><td style="padding:8px;border-top:1px solid var(--line);">(-,+)</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">III</td><td style="padding:8px;border-top:1px solid var(--line);">(-,-)</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">IV</td><td style="padding:8px;border-top:1px solid var(--line);">(+,-)</td></tr>
  </table>
  <p>Si x=0, el punto está sobre el eje Y. Si y=0, está sobre el eje X. El origen (0,0) es el único punto donde ambos valen cero.</p>

  <h3>Distancia entre dos puntos</h3>
  <p>Para hallar la distancia entre A(x₁,y₁) y B(x₂,y₂) se arma un triángulo rectángulo y se aplica el Teorema de Pitágoras.</p>
  <p class="formula">d(A,B) = √[(x₂-x₁)² + (y₂-y₁)²]</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>¿Cuál está más cerca de A(5,3): P(1,2) o Q(8,9)?<br>d(P,A) = √[(5-1)² + (3-2)²] = √(16+1) = √17<br>d(Q,A) = √[(5-8)² + (3-9)²] = √(9+36) = √45<br>Como √17 &lt; √45, <strong>P está más cerca</strong>.</p></div>

  <h3>Punto medio de un segmento</h3>
  <p>El punto medio M entre A(x₁,y₁) y B(x₂,y₂) es el promedio de las coordenadas de ambos puntos.</p>
  <p class="formula">M = ( (x₁+x₂)/2 , (y₁+y₂)/2 )</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Punto medio entre (1,2) y (7,10): M = ((1+7)/2, (2+10)/2) = (4,6).</p></div>

  <h3>Ecuación de la circunferencia</h3>
  <p>Una circunferencia es el conjunto de puntos P(x,y) que están a una misma distancia r (el radio) de un centro C(h,k). Aplicando la fórmula de distancia e igualándola a r, y elevando al cuadrado ambos lados, se obtiene:</p>
  <p class="formula">(x-h)² + (y-k)² = r²</p>

  <h3>Simetría de una gráfica</h3>
  <p>Sirve para trazar una gráfica dibujando solo la mitad y reflejando el resto.</p>
  <ul>
    <li><strong>Respecto al eje Y:</strong> si el punto (x,y) está en la gráfica, también lo está (-x,y). (La ecuación no cambia al reemplazar x por -x.)</li>

  <div class="tip-box"><span class="lbl">Antes de seguir</span><br>

  blurb:"Qué es una función, su dominio y rango, y cómo transformar y combinar sus gráficas.",
  content:`
  <h3>¿Qué es una función?</h3>
  <p>Una función es una <strong>regla</strong> que a cada elemento de un conjunto A (el dominio) le asigna <strong>un único</strong> elemento de un conjunto B (el codominio). Se nombran con letras: f, g, h...</p>
  <p class="formula">f: A → B</p>
  <p>f(x) se lee "f de x" y es el <strong>valor</strong> de f en x, o la imagen de x. Se puede pensar como una máquina: entra x, la función le aplica su regla, y sale f(x).</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Si f es la regla "elevar al cuadrado": f(2) = 2² = 4, f(3) = 3² = 9, y en general f(x) = x².</p></div>
  <ul>
    <li><strong>Dominio:</strong> conjunto de todas las entradas posibles (valores de x).</li>
    <li><strong>Rango:</strong> conjunto de todas las salidas posibles (valores de f(x)).</li>
    <li><strong>Variable independiente:</strong> x. <strong>Variable dependiente:</strong> y = f(x).</li>
  </ul>

  <h3>Cuatro formas de representar una función</h3>
  <ul>
    <li><strong>Verbal:</strong> con palabras. "Para convertir Celsius a Fahrenheit, multiplicá por 9/5 y sumá 32".</li>
    <li><strong>Algebraica:</strong> con una fórmula. A(r) = πr².</li>
    <li><strong>Visual:</strong> con una gráfica en el plano cartesiano.</li>
    <li><strong>Numérica:</strong> con una tabla de valores.</li>
  </ul>

  <h3>Dominio de una función</h3>
  <p>Si no se indica lo contrario, el dominio es el conjunto de todos los reales para los que la fórmula tiene sentido. Dos restricciones típicas:</p>
  <div class="example-box"><div class="lbl">No dividir por cero</div><p>f(x) = 1/(x-4) no está definida en x=4 → dominio: {x | x ≠ 4}</p></div>
  <div class="example-box"><div class="lbl">No hay raíz cuadrada de negativos</div><p>g(x) = √x no está definida para x negativa → dominio: {x | x ≥ 0}</p></div>

  <h3>Gráfica de una función y la prueba de la recta vertical</h3>
  <p>La gráfica de f es el conjunto de puntos (x, f(x)). La altura de la gráfica sobre un punto x es el valor de f(x). Una curva es la gráfica de una función <strong>solo si</strong> ninguna recta vertical la cruza más de una vez (si la cruzara dos veces, x tendría dos salidas distintas, y eso rompe la definición de función).</p>

  <h3>Funciones definidas por tramos</h3>
  <p>Usan fórmulas distintas según el valor de x.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>f(x) = x² si x ≤ 1, y f(x) = 2x+1 si x &gt; 1. Para x=1 se usa la primera fórmula: f(1)=1. Para x=2 se usa la segunda: f(2)=5.</p></div>

  <h3>Creciente, decreciente, máximos y mínimos locales</h3>
  <p>f es <strong>creciente</strong> en un intervalo si su gráfica sube (a mayor x, mayor f(x)); es <strong>decreciente</strong> si baja. Un <strong>máximo local</strong> es un punto donde f(a) es mayor o igual que los valores cercanos; un <strong>mínimo local</strong>, menor o igual.</p>

  <h3>Transformaciones de funciones</h3>
  <p>Conociendo la gráfica de y=f(x), se puede obtener la de funciones relacionadas sin recalcular todo:</p>
  <table style="width:100%;border-collapse:collapse;margin:10px 0;font-size:.92rem;">
    <tr style="background:var(--paper-dim);"><td style="padding:6px;">y = f(x) + c</td><td style="padding:6px;">desplaza c unidades hacia arriba</td></tr>
    <tr><td style="padding:6px;border-top:1px solid var(--line);">y = f(x) - c</td><td style="padding:6px;border-top:1px solid var(--line);">desplaza c unidades hacia abajo</td></tr>
    <tr><td style="padding:6px;border-top:1px solid var(--line);">y = f(x-c)</td><td style="padding:6px;border-top:1px solid var(--line);">desplaza c unidades a la derecha</td></tr>
    <tr><td style="padding:6px;border-top:1px solid var(--line);">y = f(x+c)</td><td style="padding:6px;border-top:1px solid var(--line);">desplaza c unidades a la izquierda</td></tr>
    <tr><td style="padding:6px;border-top:1px solid var(--line);">y = -f(x)</td><td style="padding:6px;border-top:1px solid var(--line);">refleja en el eje X</td></tr>
    <tr><td style="padding:6px;border-top:1px solid var(--line);">y = f(-x)</td><td style="padding:6px;border-top:1px solid var(--line);">refleja en el eje Y</td></tr>
    <tr><td style="padding:6px;border-top:1px solid var(--line);">y = c·f(x), c&gt;1</td><td style="padding:6px;border-top:1px solid var(--line);">alarga verticalmente</td></tr>
  </table>

  <h3>Funciones pares e impares</h3>
  <ul>
    <li><strong>Par:</strong> f(-x) = f(x) para todo x. Su gráfica es simétrica respecto al eje Y. Ej: f(x)=x².</li>
    <li><strong>Impar:</strong> f(-x) = -f(x) para todo x. Su gráfica es simétrica respecto al origen. Ej: f(x)=x³.</li>
  </ul>

  <h3>Combinar funciones</h3>
  <p>Dos funciones f y g se pueden sumar, restar, multiplicar y dividir como números: (f+g)(x) = f(x)+g(x), etc. El dominio del resultado es la intersección de los dominios de f y g (y para f/g, además se excluyen los x donde g(x)=0).</p>
  <h4>Composición de funciones</h4>
  <p>La compuesta f∘g aplica primero g y después f al resultado.</p>
  <p class="formula">(f ∘ g)(x) = f(g(x))</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>f(x)=x², g(x)=x-3 → (f∘g)(x) = f(x-3) = (x-3)². Con x=5: (f∘g)(5) = f(2) = 4.</p></div>

  <h3>Funciones uno a uno y su inversa</h3>
  <p>f es <strong>uno a uno</strong> si nunca repite un valor de salida (dos entradas distintas nunca dan la misma salida). Se comprueba con la <strong>prueba de la recta horizontal</strong>: si ninguna recta horizontal cruza la gráfica más de una vez, f es uno a uno.</p>
  <p>Solo las funciones uno a uno tienen inversa f⁻¹, que "deshace" lo que hace f: si f(a)=b, entonces f⁻¹(b)=a. Para hallarla: escribí y=f(x), despejá x en términos de y, e intercambiá x por y.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>f(x) = √(x-2). Despejando: y² = x-2 → x = y²+2. Intercambiando: <strong>f⁻¹(x) = x²+2, con x ≥ 0</strong>.</p></div>

  <div class="tip-box"><span class="lbl">Antes de seguir</span><br>

  title:"Funciones Polinomiales y Racionales",
  diff:"alta",
  diffLabel:"Alta (avanzada)",
  blurb:"Cuadráticas, polinomios de grado mayor, números complejos y funciones racionales con asíntotas.",
  content:`
  <h3>Función cuadrática</h3>
  <p>Es un polinomio de grado 2: f(x) = ax² + bx + c, con a ≠ 0. Su gráfica siempre es una <strong>parábola</strong>: abre hacia arriba (∪) si a &gt; 0, o hacia abajo (∩) si a &lt; 0.</p>
  <p>El vértice (el punto más alto o más bajo) tiene coordenadas:</p>
  <p class="formula">x = -b/(2a) &nbsp;&nbsp; y = f(-b/(2a))</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>f(x) = -2x²+3x: a=-2, b=3 → x = -3/(2·-2) = 3/4. Como a&lt;0, ese punto es un <strong>máximo</strong>.</p></div>

  <h3>Funciones polinomiales</h3>
  <p>Una función polinomial de grado n tiene la forma P(x) = aₙxⁿ + ... + a₁x + a₀, con aₙ ≠ 0. Su gráfica es siempre una curva <strong>continua</strong> y <strong>sin irregularidades</strong> (sin saltos ni esquinas puntiagudas).</p>
  <h4>Comportamiento final</h4>
  <p>Describe qué pasa con y cuando x crece mucho (x→∞) o decrece mucho (x→-∞). Lo determina solo el término de mayor grado:</p>
  <ul>
    <li>Grado <strong>par</strong>, coeficiente principal <strong>positivo</strong>: ambos extremos suben (como una parábola ∪).</li>
    <li>Grado <strong>par</strong>, coeficiente principal <strong>negativo</strong>: ambos extremos bajan.</li>
    <li>Grado <strong>impar</strong>, coeficiente principal <strong>positivo</strong>: baja a la izquierda, sube a la derecha.</li>
    <li>Grado <strong>impar</strong>, coeficiente principal <strong>negativo</strong>: sube a la izquierda, baja a la derecha.</li>
  </ul>

  <h3>Ceros de un polinomio</h3>
  <p>c es un <strong>cero</strong> de P si P(c)=0. Los ceros son los puntos donde la gráfica cruza el eje X. Para graficar: 1) factorizá y hallá los ceros, 2) probá un punto en cada intervalo entre ceros para saber si la gráfica está arriba o abajo del eje, 3) aplicá el comportamiento final, 4) unilos con una curva suave.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>P(x) = (x+2)(x-1)(x-3) tiene ceros en x=-2, 1 y 3. Grado 3 (impar) con coeficiente principal positivo: baja a la izquierda, sube a la derecha.</p></div>

  <h3>División de polinomios</h3>
  <p>Sirve para simplificar P(x)/D(x). Igual que con números: P(x) = D(x)·Q(x) + R(x), donde el residuo R tiene grado menor que el divisor.</p>
  <p>Cuando el divisor es de la forma x-c, se puede usar <strong>división sintética</strong> (más rápida): se bajan los coeficientes, se multiplica por c y se suma, repitiendo hasta terminar.</p>
  <div class="example-box"><div class="lbl">Teorema del residuo</div><p>Si P(x) se divide entre x-c, el residuo es exactamente P(c). Por eso la división sintética también sirve para evaluar funciones.</p></div>
  <div class="example-box"><div class="lbl">Teorema del factor</div><p>c es cero de P si y solo si (x-c) es un factor de P(x). Ej: P(1) = 1³-7(1)+6 = 0, entonces (x-1) es factor de P(x)=x³-7x+6.</p></div>

  <h3>Ceros racionales</h3>
  <p>Si P tiene coeficientes enteros, todo cero racional es de la forma p/q, donde p es un factor del término constante y q es un factor del coeficiente principal. Se prueba cada candidato con división sintética hasta encontrar los que dan residuo 0.</p>

  <h3>Números complejos</h3>
  <p>Un número complejo tiene la forma a+bi, donde a y b son reales e i² = -1. a es la parte real, b la parte imaginaria. Se suman, restan y multiplican como binomios, usando i²=-1 cuando aparece.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>(3+5i) + (4-2i) = 7+3i &nbsp;·&nbsp; (3+5i)(4-2i) = 22+14i</p></div>
  <h4>Raíces cuadradas de números negativos</h4>
  <p class="formula">√-r = i√r &nbsp; (para r &gt; 0)</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>√-16 = i√16 = 4i</p></div>
  <h4>Ecuaciones cuadráticas con soluciones complejas</h4>
  <p>Cuando b²-4ac &lt; 0 en la fórmula cuadrática, no hay solución real, pero sí compleja.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>x²+9=0 → x²=-9 → x = ±√-9 = ±3i</p></div>

  <h3>Teorema fundamental del álgebra</h3>
  <p>Toda función polinomial de grado n≥1 tiene exactamente n ceros complejos (contando cada uno tantas veces como su <strong>multiplicidad</strong>), y se puede factorizar completamente en n factores lineales usando números complejos.</p>

  <h3>Funciones racionales y asíntotas</h3>
  <p>Una función racional es r(x) = P(x)/Q(x), con P y Q polinomios. Su dominio excluye los x donde Q(x)=0.</p>
  <ul>
    <li><strong>Asíntota vertical</strong> x=a: ocurre donde el denominador (ya simplificado) se anula. La gráfica se dispara hacia +∞ o -∞ cerca de esa recta.</li>
    <li><strong>Asíntota horizontal:</strong> compara los grados de P y Q. Si grado(P) &lt; grado(Q), la asíntota es y=0. Si son iguales, es y = (coeficiente principal de P)/(coeficiente principal de Q). Si grado(P) &gt; grado(Q), no hay asíntota horizontal.</li>
    <li><strong>Asíntota diagonal (oblicua):</strong> aparece cuando grado(P) es exactamente uno más que grado(Q); se obtiene dividiendo P entre Q.</li>
  </ul>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>r(x) = (3x²-2x-1)/(2x²+3x-2): mismo grado arriba y abajo → asíntota horizontal y=3/2. El denominador factoriza como (2x-1)(x+2) → asíntotas verticales x=1/2 y x=-2.</p></div>

  <div class="tip-box"><span class="lbl">Antes de seguir</span><br>
  Ya viste cómo se comportan y grafican los polinomios y las funciones racionales. El próximo tema presenta las funciones exponenciales y logarítmicas, que crecen (o decrecen) de una forma totalmente distinta.</div>

  <h3>Practicá</h3>
  <details class="practice"><summary>Encontrá el vértice de f(x) = x² + 4x</summary><div class="sol">x = -b/(2a) = -4/2 = -2. f(-2) = 4-8 = -4. Vértice: (-2,-4)</div></details>
  <details class="practice"><summary>Resolvé: x² + 2x + 5 = 0</summary><div class="sol">x = (-2 ± √(4-20))/2 = (-2 ± √-16)/2 = (-2 ± 4i)/2 = -1 ± 2i</div></details>
  <details class="practice"><summary>¿Cuál es la asíntota vertical de r(x) = (x+1)/(x-3)?</summary><div class="sol">El denominador es 0 en x=3, entonces la asíntota vertical es x=3.</div></details>
  `
}

  content:`
  <h3>¿Qué es una función exponencial?</h3>
  <p>Es una función de la forma <span class="formula">f(x) = aˣ</span>, donde la base a es un número real con a &gt; 0 y a ≠ 1 (se excluye a=1 porque f(x)=1ˣ=1 es una función constante, no exponencial). A diferencia de una potencia como x², acá la variable está en el <strong>exponente</strong>, no en la base.</p>
  <div class="example-box"><div class="lbl">Por qué crecen tan rápido</div><p>f(x)=2ˣ: f(3)=8, f(10)=1024, f(30)=1,073,741,824. Compará con g(x)=x²: g(30)=900 nada más. Un pequeño cambio en x genera un cambio enorme en f(x).</p></div>

  <h3>Gráfica y comportamiento</h3>
  <p>La función f(x)=aˣ siempre pasa por (0,1), porque a⁰=1 para cualquier a≠0. Su dominio es todos los reales (ℝ) y su rango es (0,∞): nunca toca ni cruza el eje x.</p>
  <ul>
    <li>Si <strong>a &gt; 1</strong>: la función crece rápidamente (curva sube de izquierda a derecha).</li>
    <li>Si <strong>0 &lt; a &lt; 1</strong>: la función decrece rápidamente (curva baja de izquierda a derecha).</li>
  </ul>
  <p>El eje x (y=0) es una <strong>asíntota horizontal</strong>: la curva se acerca a él pero nunca lo toca.</p>

  <h3>Interés compuesto: la aplicación clásica</h3>
  <p class="formula">A(t) = P(1 + r/n)ⁿᵗ</p>
  <p>P es el capital inicial, r la tasa anual, n las veces que se capitaliza por año, t los años. Es una función exponencial con base (1+r/n).</p>

  <h3>El número e</h3>
  <p>Es el valor al que se aproxima (1+1/n)ⁿ cuando n crece indefinidamente: e ≈ 2.71828... Es irracional. Cuando el interés se capitaliza "a cada instante" (continuamente), la fórmula se simplifica a:</p>
  <p class="formula">A(t) = Peʳᵗ</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>$1000 al 12% anual, capitalizado continuamente, durante 3 años: A(3)=1000e⁰·³⁶ ≈ $1433.33</p></div>

  <h3>Función logarítmica: la inversa</h3>
  <p>Como f(x)=aˣ es biunívoca (pasa la prueba de la recta horizontal), tiene inversa: la función <strong>logarítmica</strong> con base a.</p>
  <p class="formula">logₐ x = y &nbsp;⟺&nbsp; aʸ = x</p>
  <p>En otras palabras, logₐ x es el exponente al que hay que elevar a para obtener x. Su dominio es (0,∞) y su rango es ℝ (al revés que la exponencial). El eje y es su asíntota vertical.</p>
  <div class="example-box"><div class="lbl">Ejemplos</div><p>log₁₀ 1000 = 3, porque 10³=1000 &nbsp;·&nbsp; log₂ 32 = 5, porque 2⁵=32 &nbsp;·&nbsp; log₁₆ 4 = 1/2, porque 16^(1/2)=4</p></div>

  <h3>Logaritmo común y natural</h3>
  <ul>
    <li><strong>Logaritmo común</strong> (base 10): se escribe simplemente "log x" (sin la base).</li>
    <li><strong>Logaritmo natural</strong> (base e): se escribe "ln x". Es el que más se usa en cálculo.</li>
  </ul>

  <h3>Leyes de logaritmos</h3>
  <table style="width:100%;border-collapse:collapse;margin:12px 0;">
    <tr style="background:var(--paper-dim);"><th style="text-align:left;padding:8px;">Ley</th><th style="text-align:left;padding:8px;">Fórmula</th></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">1. Producto</td><td style="padding:8px;border-top:1px solid var(--line);">logₐ(AB) = logₐA + logₐB</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">2. Cociente</td><td style="padding:8px;border-top:1px solid var(--line);">logₐ(A/B) = logₐA − logₐB</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">3. Potencia</td><td style="padding:8px;border-top:1px solid var(--line);">logₐ(Aᶜ) = C·logₐA</td></tr>
  </table>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>log₄2 + log₄32 = log₄(2·32) = log₄64 = 3, porque 4³=64</p></div>

  <h3>Fórmula de cambio de base</h3>
  <p class="formula">logᵦ x = logₐ x / logₐ b</p>
  <p>Sirve para calcular un logaritmo en cualquier base usando la calculadora (que solo trae log y ln).</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>log₈5 = log 5 / log 8 ≈ 0.77398</p></div>

  <h3>Resolver ecuaciones exponenciales</h3>
  <p>Se aísla la expresión exponencial, se toma logaritmo de ambos lados y se usa la Ley 3 para "bajar" el exponente.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>2ˣ=7 → ln(2ˣ)=ln7 → x·ln2=ln7 → x = ln7/ln2 ≈ 2.807</p></div>

  <h3>Resolver ecuaciones logarítmicas</h3>
  <p>Se aísla el término logarítmico y se reescribe en forma exponencial (o se eleva la base a cada lado).</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>log₂(x+2)=5 → x+2=2⁵ → x=32−2=30</p></div>

  <div class="tip-box"><span class="lbl">Antes de seguir</span><br>
  Ya viste funciones que crecen o decrecen sin repetirse. El próximo tema presenta un tipo de función totalmente distinto: las funciones trigonométricas, que se repiten (son periódicas) y se definen a partir de un círculo.</div>

  <h3>Practicá</h3>
  <details class="practice"><summary>Resolvé: 8e²ˣ = 20</summary><div class="sol">e²ˣ = 2.5 → 2x = ln 2.5 → x = ln(2.5)/2 ≈ 0.458</div></details>
  <details class="practice"><summary>Resolvé: log(x+2) + log(x-1) = 1</summary><div class="sol">log[(x+2)(x-1)]=1 → (x+2)(x-1)=10 → x²+x-12=0 → (x+4)(x-3)=0 → x=-4 o x=3. Se descarta x=-4 (log de negativo no existe), entonces x=3.</div></details>
  `
},

  title:"Funciones Trigonométricas: Circunferencia Unitaria",

  blurb:"Seno, coseno y las demás funciones trigonométricas definidas a partir del círculo de radio 1.",
  content:`
  <h3>La circunferencia unitaria</h3>
  <p>Es el círculo de radio 1 con centro en el origen. Su ecuación es <span class="formula">x² + y² = 1</span>. Cualquier punto P(x,y) que cumpla esa ecuación está sobre ella.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>P(√3/3, √6/3) está en la circunferencia unitaria porque (√3/3)²+(√6/3)² = 3/9+6/9 = 1</p></div>

  <h3>Puntos terminales</h3>
  <p>Si marcamos una distancia t a lo largo de la circunferencia, empezando en (1,0) y moviéndonos en sentido contrario a las manecillas del reloj (si t&gt;0) o a favor (si t&lt;0), llegamos a un punto P(x,y) llamado <strong>punto terminal</strong> determinado por t.</p>
  <p>Como la circunferencia completa mide 2π, dar la vuelta entera recorre 2π, media vuelta recorre π, y un cuarto de vuelta recorre π/2.</p>

  <h3>Número de referencia</h3>
  <p>Para hallar el punto terminal en cualquier cuadrante, primero se busca el número de referencia t̄: la distancia más corta entre el punto terminal y el eje x. Con eso se ubica el punto terminal "equivalente" del primer cuadrante y luego se ajustan los signos según el cuadrante real.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Para t=5π/6 (segundo cuadrante): t̄ = π − 5π/6 = π/6. El punto terminal de π/6 es (√3/2, 1/2); como estamos en el 2° cuadrante (x negativa, y positiva), el punto terminal de t es (−√3/2, 1/2).</p></div>

  <h3>Definición de las funciones trigonométricas</h3>
  <p>Sea t cualquier número real y P(x,y) el punto terminal en la circunferencia unitaria determinado por t:</p>
  <p class="formula">sen t = y &nbsp;&nbsp; cos t = x &nbsp;&nbsp; tan t = y/x (x≠0)</p>
  <p class="formula">csc t = 1/y (y≠0) &nbsp;&nbsp; sec t = 1/x (x≠0) &nbsp;&nbsp; cot t = x/y (y≠0)</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Para t=π/3, el punto terminal es (1/2, √3/2): sen(π/3)=√3/2, cos(π/3)=1/2, tan(π/3)=√3</p></div>

  <h3>Dominios</h3>
  <table style="width:100%;border-collapse:collapse;margin:12px 0;">
    <tr style="background:var(--paper-dim);"><th style="text-align:left;padding:8px;">Función</th><th style="text-align:left;padding:8px;">Dominio</th></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">sen t, cos t</td><td style="padding:8px;border-top:1px solid var(--line);">Todos los reales</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">tan t, sec t</td><td style="padding:8px;border-top:1px solid var(--line);">Todos excepto π/2 + nπ</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">cot t, csc t</td><td style="padding:8px;border-top:1px solid var(--line);">Todos excepto nπ</td></tr>
  </table>

  <h3>Signos según el cuadrante</h3>
  <div class="example-box"><div class="lbl">Regla mnemotécnica</div><p>Cuadrante I: todas positivas. Cuadrante II: sen y csc positivas. Cuadrante III: tan y cot positivas. Cuadrante IV: cos y sec positivas.</p></div>

  <h3>Propiedades pares-impares</h3>
  <p>Seno, cosecante, tangente y cotangente son funciones <strong>impares</strong>: sen(−t)=−sen t. Coseno y secante son <strong>pares</strong>: cos(−t)=cos t.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>sen(−π/6) = −sen(π/6) = −1/2 &nbsp;·&nbsp; cos(−π/4) = cos(π/4) = √2/2</p></div>

  <h3>Identidades fundamentales</h3>
  <p><strong>Recíprocas:</strong> csc t=1/sen t, sec t=1/cos t, cot t=1/tan t, tan t=sen t/cos t</p>
  <p><strong>De Pitágoras:</strong></p>
  <p class="formula">sen²t + cos²t = 1 &nbsp;&nbsp; tan²t + 1 = sec²t &nbsp;&nbsp; 1 + cot²t = csc²t</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Si cos t=3/5 y t está en el 4° cuadrante: sen²t=1−9/25=16/25 → sen t=−4/5 (negativo en el 4° cuadrante)</p></div>

  <h3>Gráficas de seno y coseno</h3>
  <p>Ambas son <strong>periódicas</strong> con período 2π: sen(t+2π)=sen t. La gráfica de seno es simétrica respecto al origen (función impar); la de coseno es simétrica respecto al eje y (función par).</p>

  <h3>Amplitud, período y desfase</h3>
  <p>Para y = a sen k(x−b) o y = a cos k(x−b), con k&gt;0:</p>
  <p class="formula">amplitud = |a| &nbsp;&nbsp; período = 2π/k &nbsp;&nbsp; desfase = b</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>y = 3 sen 2(x−π/4): amplitud=3, período=2π/2=π, desfase=π/4 (a la derecha)</p></div>

  <div class="tip-box"><span class="lbl">Antes de seguir</span><br>
  Ya viste las funciones trigonométricas desde el círculo unitario, ideal para números reales y cálculo. El siguiente tema las presenta desde otro ángulo (literalmente): el triángulo rectángulo, más útil para medir distancias y ángulos en la práctica.</div>

  <h3>Practicá</h3>
  <details class="practice"><summary>Encontrá el número de referencia para t=7π/4</summary><div class="sol">El punto terminal está en el 4° cuadrante, entonces t̄ = 2π − 7π/4 = π/4</div></details>
  <details class="practice"><summary>Calculá cos(2π/3)</summary><div class="sol">El número de referencia es π/3 y el punto terminal está en el 2° cuadrante (cos negativo): cos(2π/3) = −cos(π/3) = −1/2</div></details>
  `
},

  blurb:"Ángulos, radianes, relaciones trigonométricas en triángulos, y las leyes de senos y cosenos para resolver cualquier triángulo.",
  content:`
  <h3>Ángulos y su medida</h3>
  <p>Un ángulo se forma al rotar un rayo (lado inicial) hasta otra posición (lado terminal), con vértice común. Rotación contraria a las manecillas del reloj = ángulo positivo; a favor = ángulo negativo.</p>
  <p>Además de los grados, se usa la medida en <strong>radianes</strong>: en un círculo de radio 1, el ángulo en radianes es igual a la longitud del arco que subtiende.</p>
  <p class="formula">180° = π rad &nbsp;&nbsp; 1° = π/180 rad &nbsp;&nbsp; 1 rad = (180/π)°</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>60° = 60(π/180) = π/3 rad &nbsp;·&nbsp; π/6 rad = (π/6)(180/π) = 30°</p></div>

  <h3>Ángulos coterminales</h3>
  <p>Dos ángulos en posición normal (vértice en el origen, lado inicial en el eje x positivo) son coterminales si comparten el mismo lado terminal. Se obtienen sumando o restando múltiplos de 360° (o 2π).</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>30°+360°=390° y 30°−360°=−330° son coterminales con 30°</p></div>

  <h3>Longitud de arco y área de sector</h3>
  <p class="formula">s = rθ &nbsp;&nbsp; A = ½r²θ</p>
  <p>Donde θ está en radianes, r es el radio, s la longitud del arco y A el área del sector.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Radio 10 m, ángulo 30°=π/6 rad: s = 10·(π/6) = 5π/3 m</p></div>

  <h3>Velocidad lineal y angular</h3>
  <p class="formula">ω = θ/t &nbsp;&nbsp; v = s/t &nbsp;&nbsp; v = rω</p>

  <h3>Relaciones trigonométricas en el triángulo rectángulo</h3>
  <p>Con θ un ángulo agudo del triángulo:</p>
  <p class="formula">sen θ = opuesto/hipotenusa &nbsp;&nbsp; cos θ = adyacente/hipotenusa &nbsp;&nbsp; tan θ = opuesto/adyacente</p>
  <p class="formula">csc θ = hipotenusa/opuesto &nbsp;&nbsp; sec θ = hipotenusa/adyacente &nbsp;&nbsp; cot θ = adyacente/opuesto</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Con catetos 2 y √5 e hipotenusa 3: sen θ=2/3, cos θ=√5/3, tan θ=2/√5</p></div>

  <h3>Triángulos especiales</h3>
  <p>Del cuadrado de lado 1 sale el triángulo 45°-45°-90°; del triángulo equilátero de lado 2 sale el 30°-60°-90°. Sus relaciones se usan tanto que conviene memorizarlas: sen30°=1/2, cos30°=√3/2, sen45°=√2/2, sen60°=√3/2, tan45°=1, etc.</p>

  <h3>Funciones trigonométricas de cualquier ángulo</h3>
  <p>Se extiende la definición poniendo θ en posición normal, con P(x,y) en el lado terminal y r=√(x²+y²):</p>
  <p class="formula">sen θ = y/r &nbsp;&nbsp; cos θ = x/r &nbsp;&nbsp; tan θ = y/x</p>
  <p>El <strong>ángulo de referencia</strong> θ̄ es el ángulo agudo entre el lado terminal y el eje x; el valor de la función de θ es igual (salvo el signo, según el cuadrante) al de θ̄.</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>cos135°: el ángulo de referencia es 45° y el 2° cuadrante da coseno negativo → cos135° = −√2/2</p></div>

  <h3>Área de un triángulo con ángulo incluido</h3>
  <p class="formula">A = ½ab sen θ</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Lados 10 y 3, ángulo incluido 120°: A = ½(10)(3)sen120° = 15·(√3/2) ≈ 13 cm²</p></div>

  <h3>Ley de Senos (Casos LAA y LLA)</h3>
  <p class="formula">sen A / a = sen B / b = sen C / c</p>
  <p>Se usa cuando se conocen un lado y dos ángulos, o dos lados y el ángulo opuesto a uno de ellos (este último es el "caso ambiguo": puede haber 0, 1 o 2 soluciones, según si sen B calculado es &gt;1, da un triángulo rectángulo, o admite dos ángulos posibles menores a 180°).</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>∠A=20°, ∠C=25°, c=80.4 → ∠B=135°. a = c·senA/senC = 80.4·sen20°/sen25° ≈ 65.1</p></div>

  <h3>Ley de Cosenos (Casos LAL y LLL)</h3>
  <p class="formula">a² = b² + c² − 2bc·cosA</p>
  <p>Se usa cuando se conocen dos lados y el ángulo entre ellos, o los tres lados. Si el ángulo es recto, cos=0 y la fórmula se reduce al Teorema de Pitágoras (es un caso especial).</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>∠A=46.5°, b=10.5, c=18.0: a² = 10.5²+18.0²−2(10.5)(18.0)cos46.5° ≈ 174.05 → a ≈ 13.2</p></div>

  <h3>Fórmula de Herón</h3>
  <p>Para hallar el área de un triángulo conociendo solo sus tres lados:</p>
  <p class="formula">A = √[s(s−a)(s−b)(s−c)] &nbsp;&nbsp; con s = (a+b+c)/2</p>
  <div class="example-box"><div class="lbl">Ejemplo</div><p>Lados 125, 280, 315: s=360 → A=√[360(235)(80)(45)] ≈ 17,451.6</p></div>

  <div class="tip-box"><span class="lbl">Antes de seguir</span><br>
  Ya sabés calcular seno, coseno y tangente en un triángulo, y resolver cualquier triángulo con las leyes de senos y cosenos. El último tema de la ruta, "Trigonometría Analítica", retoma estas funciones para manipular identidades y resolver ecuaciones trigonométricas.</div>

  <h3>Practicá</h3>
  <details class="practice"><summary>Convertí 5π/4 rad a grados</summary><div class="sol">(5π/4)(180/π) = 900/4 = 225°</div></details>
  <details class="practice"><summary>Resolvé el triángulo ABC con ∠A=30°, ∠B=60° (∠C=90°) y c=12 (hipotenusa)</summary><div class="sol">a = 12·sen30° = 6 &nbsp;·&nbsp; b = 12·sen60° = 6√3</div></details>
  <details class="practice"><summary>Encontrá el área de un triángulo con lados 9, 12 y 15</summary><div class="sol">s=(9+12+15)/2=18. A=√[18(9)(6)(3)]=√2916=54</div></details>
  `
},
{

  blurb:"Identidades trigonométricas, fórmulas de adición, ángulo doble, semiángulo, y cómo resolver ecuaciones trigonométricas.",
  content:`
  <h3>Identidades trigonométricas fundamentales</h3>
  <table style="width:100%;border-collapse:collapse;margin:10px 0;">
    <tr style="background:var(--paper-dim);"><th style="text-align:left;padding:8px;">Tipo</th><th style="text-align:left;padding:8px;">Fórmulas</th></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Recíprocas</td><td style="padding:8px;border-top:1px solid var(--line);">csc x=1/sen x, sec x=1/cos x, cot x=1/tan x, tan x=sen x/cos x</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Pitagóricas</td><td style="padding:8px;border-top:1px solid var(--line);">sen²x+cos²x=1, tan²x+1=sec²x, 1+cot²x=csc²x</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Pares e impares</td><td style="padding:8px;border-top:1px solid var(--line);">sen(−x)=−sen x, cos(−x)=cos x, tan(−x)=−tan x</td></tr>
    <tr><td style="padding:8px;border-top:1px solid var(--line);">Cofunción</td><td style="padding:8px;border-top:1px solid var(--line);">sen(π/2−u)=cos u, cos(π/2−u)=sen u, tan(π/2−u)=cot u</td></tr>
  </table>

  <h3>Simplificar y demostrar identidades</h3>
  <p>Para simplificar, se reescribe todo en términos de seno y coseno y se usan las identidades fundamentales:</p>
  <div class="example-box"><div class="lbl">cos t + tan t·sen t</div><p>= cos t + (sen t/cos t)sen t = (cos²t+sen²t)/cos t = 1/cos t = <strong>sec t</strong></p></div>
  <div class="tip-box"><span class="lbl">Guía para demostrar identidades</span><br>1) Empezá con el lado más complicado. 2) Usá identidades conocidas y álgebra. 3) Si te trabás, convertí todo a senos y cosenos.</div>

  <h3>Fórmulas de adición y sustracción</h3>
  <p class="formula">sen(s±t) = sen s cos t ± cos s sen t</p>
  <p class="formula">cos(s±t) = cos s cos t ∓ sen s sen t</p>
  <p class="formula">tan(s±t) = (tan s ± tan t) / (1 ∓ tan s tan t)</p>
  <div class="example-box"><div class="lbl">cos 75°</div><p>75°=45°+30° → cos45°cos30°−sen45°sen30° = <strong>(√6−√2)/4</strong></p></div>

  <h3>Ángulo doble y semiángulo</h3>
  <p class="formula">sen 2x = 2 sen x cos x &nbsp;&nbsp; cos 2x = cos²x−sen²x = 1−2sen²x = 2cos²x−1</p>
  <p class="formula">sen(u/2) = ±√[(1−cos u)/2] &nbsp;&nbsp; cos(u/2) = ±√[(1+cos u)/2]</p>
  <div class="tip-box"><span class="lbl">El signo ± depende del cuadrante</span><br>Se elige + o − según en qué cuadrante esté u/2.</div>
  <div class="example-box"><div class="lbl">Si cos x=−2/3, x en cuadrante II</div><p>cos 2x = 2(−2/3)²−1 = 8/9−1 = <strong>−1/9</strong></p></div>

  <h3>Producto a suma y suma a producto</h3>
  <p class="formula">sen u cos v = ½[sen(u+v) + sen(u−v)]</p>
  <p class="formula">sen x + sen y = 2 sen[(x+y)/2] cos[(x−y)/2]</p>

  <h3>Ecuaciones trigonométricas básicas</h3>
  <p>Se reducen a resolver T(θ) = c. Primero se buscan las soluciones en un período, y luego se generalizan sumando múltiplos del período.</p>
  <div class="example-box"><div class="lbl">sen θ = 1/2</div><p>En [0,2π]: θ=π/6 ó θ=5π/6 → <strong>θ = π/6 + 2kπ ó θ = 5π/6 + 2kπ</strong></p></div>
  <div class="example-box"><div class="lbl">Por factorización: 2cos²θ − 7cos θ + 3 = 0</div><p>(2cosθ−1)(cosθ−3)=0 → cosθ=1/2 (cosθ=3 imposible) → <strong>θ=π/3+2kπ ó θ=5π/3+2kπ</strong></p></div>

  <div class="tip-box"><span class="lbl">Para cerrar</span><br>Con este tema, la trigonometría queda completa: desde definir seno y coseno en el círculo unitario, hasta manipular identidades y resolver cualquier ecuación trigonométrica.</div>

  <h3>Practicá</h3>
  <details class="practice"><summary>Escribí sen 3x sen 5x como suma de funciones trigonométricas</summary><div class="sol">½[cos(3x−5x)−cos(3x+5x)] = <strong>½cos2x − ½cos8x</strong></div></details>
  <details class="practice"><summary>Resolvé: tan θ = 2 (dar la forma general de las soluciones)</summary><div class="sol">θ = tan⁻¹(2) ≈ 1.11 → como el período es π: <strong>θ ≈ 1.11 + kπ</strong></div></details>
  `
}

const STORAGE_KEY = 'ruta-matematica-completados';
let completed;
try{
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
  completed = new Set(Array.isArray(saved) ? saved : []);
}catch(e){
  completed = new Set();
}
function saveCompleted(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify([...completed])); }catch(e){ /* almacenamiento no disponible, se sigue igual en memoria */ }
}
const stationsEl = document.getElementById('stations');

function diffClass(d){
  if(d.indexOf('facil')===0 || d==='facil') return 'diff-facil';
  if(d==='alta') return 'diff-alta';
  return 'diff-media';
}

function renderStations(){
  stationsEl.innerHTML = '';
  TOPICS.forEach(t=>{
    const st = document.createElement('div');
    st.className = 'station' + (completed.has(t.id) ? ' done' : '');
    st.innerHTML = `
      <div class="station-node"><span class="num">${t.num}</span><span class="check">✓</span></div>
      <div class="station-card" data-id="${t.id}">
        <span class="diff ${diffClass(t.diff)}">${t.diffLabel}</span>
        <h3>${t.title}</h3>
        <p>${t.blurb}</p>
      </div>`;
    st.querySelector('.station-card').addEventListener('click', ()=>openTopic(t.id));
    stationsEl.appendChild(st);
  });
  // estación herramienta: generador de ejercicios
  const gen = document.createElement('div');
  gen.className = 'station tool';
  gen.innerHTML = `
    <div class="station-node">⚙</div>
    <div class="station-card" data-id="generador">
      <span class="diff" style="background:rgba(255,255,255,.15);color:#fff;">Herramienta</span>
      <h3>Generador de ejercicios</h3>
      <p>Practicá con problemas al azar de cualquier tema, con solución.</p>
    </div>`;
  gen.querySelector('.station-card').addEventListener('click', openGenerator);
  stationsEl.appendChild(gen);

  updateProgress();
}

function updateProgress(){
  document.getElementById('progress-text').textContent = completed.size + ' / ' + TOPICS.length + ' completados';
  document.getElementById('progress-fill').style.width = Math.round(100*completed.size/TOPICS.length) + '%';
}

let currentTopicId = null;

function openTopic(id){
  const t = TOPICS.find(x=>x.id===id);
  currentTopicId = id;
  topicTitle.textContent = t.num + '. ' + t.title;
  topicDiff.textContent = t.diffLabel;
  topicDiff.className = 'diff ' + diffClass(t.diff);
  topicContent.innerHTML = t.content;
  markBtn.style.display = 'inline-block';
  markBtn.textContent = completed.has(id) ? '✓ Completado — desmarcar' : 'Marcar como completado';
  markBtn.className = completed.has(id) ? 'on' : '';
  timelineView.style.display = 'none';
  topicView.style.display = 'block';
  window.scrollTo(0,0);
}

markBtn.addEventListener('click', ()=>{
  if(!currentTopicId) return;
  if(completed.has(currentTopicId)){ completed.delete(currentTopicId); }
  else{ completed.add(currentTopicId); }
  markBtn.textContent = completed.has(currentTopicId) ? '✓ Completado — desmarcar' : 'Marcar como completado';
  markBtn.className = completed.has(currentTopicId) ? 'on' : '';
  saveCompleted();
  renderStations();
});

document.getElementById('back-btn').addEventListener('click', ()=>{

function ri(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function showGenOutput(question, solutionHtml){
  const out = document.getElementById('gen-output');
  out.innerHTML = `
    <div class="q">${question}</div>
    <button id="gen-reveal">Ver solución</button>
    <div id="gen-solution">${solutionHtml}</div>
  `;
  document.getElementById('gen-reveal').addEventListener('click', ()=>{
    const sol = document.getElementById('gen-solution');
    sol.style.display = sol.style.display==='block' ? 'none' : 'block';
  });
}

function generate(topic){
  if(topic==='metodo'){
    const cases = [
      {s:"Un investigador nota que ciertos pacientes duermen mejor con la ventana abierta y anota el dato.", a:"Observación"},
      {s:"Se pregunta: 'a partir de lo observado, si les doy más aire fresco antes de dormir, ¿dormirán mejor?' y propone esa idea como posible explicación.", a:"Hipótesis"},
      {s:"Deja la ventana abierta a 20 pacientes y cerrada a otros 20, durante un mes, y mide sus horas de sueño.", a:"Experimentación"},
      {s:"Después de repetir el experimento en 5 hospitales distintos y confirmar el patrón, publica la conclusión como válida.", a:"Tesis"}
    ];
    const c = pick(cases);
    showGenOutput(`Leé la situación y decí qué paso del método científico representa:<br><em>"${c.s}"</em>`,
      `Respuesta: <strong>${c.a}</strong>`);
  }
  else if(topic==='logica'){
    const pairs=[["\"2 es par\"","\"3 es impar\""],["\"el cielo es celeste\"","\"el pasto es verde\""],["\"5 es primo\"","\"8 es par\""]];
    const [p,q] = pick(pairs);
    const conn = pick([
      {sym:"∧", word:"y"},
      {sym:"∨", word:"o"},
      {sym:"→", word:"si ... entonces"},
      {sym:"↔", word:"... si y solo si ..."}
    ]);
    let frase, resp;
    if(conn.sym==="→"){ frase = `Si ${p.replace(/"/g,'')}, entonces ${q.replace(/"/g,'')}`; resp = `(p → q)`; }
    else if(conn.sym==="↔"){ frase = `${p.replace(/"/g,'')} si y solo si ${q.replace(/"/g,'')}`; resp = `(p ↔ q)`; }
    else { frase = `${p.replace(/"/g,'')} ${conn.word} ${q.replace(/"/g,'')}`; resp = `(p ${conn.sym} q)`; }
    showGenOutput(`Formalizá la siguiente frase usando p: ${p} y q: ${q}:<br><em>"${frase}"</em>`,
      `Respuesta: <span class="formula">${resp}</span>`);
  }
  else if(topic==='conjuntos'){
    const nums = [
      {v:"7", set:"ℕ, ℤ, ℚ, ℝ"},
      {v:"-3", set:"ℤ, ℚ, ℝ"},
      {v:"2/5", set:"ℚ, ℝ"},
      {v:"-9/4", set:"ℚ, ℝ"},
      {v:"√2", set:"ℚ* (irracional), ℝ"},
      {v:"π", set:"ℚ* (irracional), ℝ"},
      {v:"0", set:"ℤ, ℚ, ℝ (no es ℕ en esta definición, porque ℕ empieza en 1)"},
      {v:"-√5", set:"ℚ* (irracional), ℝ"}
    ];
    const n = pick(nums);
    showGenOutput(`¿A qué conjunto(s) numérico(s) pertenece el número <strong>${n.v}</strong>?`,
      `Pertenece a: <strong>${n.set}</strong>`);
  }
  else if(topic==='demostraciones'){
    const qs=[
      {s:"Demostrar que no existen dos enteros a y b tales que 4a+8b=3", a:"Contradicción: se supone que sí existen, se llega a que un entero debería igualar una fracción no entera, lo cual es absurdo."},
      {s:"Refutar la afirmación 'todo número primo es impar'", a:"Contraejemplo: el 2 es primo y es par."},
      {s:"Probar que la suma de dos enteros consecutivos siempre es impar, revisando 5 pares consecutivos concretos", a:"Por casos: se prueba con varios pares de números concretos y se verifica el patrón en cada uno."},
      {s:"Probar, partiendo de que 'todo número par se puede escribir como 2k', que la suma de dos pares es par", a:"Deducción: se parte de hechos conocidos (2k) y se avanza paso a paso hasta la conclusión."}
    ];
    const q = pick(qs);
    showGenOutput(`¿Qué técnica de demostración conviene usar para esto?<br><em>"${q.s}"</em>`,
      `Respuesta sugerida: <strong>${q.a}</strong>`);
  }
  else if(topic==='modular'){
    const a = ri(-40,60);
    const b = ri(2,12);
    let r = a % b;
    if(r<0) r += b;
    showGenOutput(`Calculá: ${a} mod ${b}`,
      `Resultado: <strong>${r}</strong> (sumá o restá ${b} a ${a} hasta que quede entre 0 y ${b-1})`);
  }
  else if(topic==='exponentes'){
    const type = pick(['prod','coc','neg','raiz']);
    if(type==='prod'){
      const base=ri(2,5), e1=ri(1,4), e2=ri(1,4);
      showGenOutput(`Simplificá: ${base}<sup>${e1}</sup> · ${base}<sup>${e2}</sup>`,
        `${base}<sup>${e1+e2}</sup> = ${Math.pow(base,e1+e2)}`);
    } else if(type==='coc'){
      const base=ri(2,6), e1=ri(4,7), e2=ri(1,3);
      showGenOutput(`Simplificá: ${base}<sup>${e1}</sup> / ${base}<sup>${e2}</sup>`,

      let signSen = cuad===2?'':cuad===3?'-':'-';
      let signCos = cuad===2?'-':cuad===3?'-':'';
      showGenOutput(`El número de referencia de cierto t es ${s.t}, y el punto terminal de t está en el cuadrante ${cuad}. Encontrá sen t y cos t`,
        `sen t = ${signSen}${s.sen} &nbsp;·&nbsp; cos t = ${signCos}${s.cos}`);
    } else {
      const funcs = ['sen','cos','tan'];
      const f = pick(funcs);
      const cuad = ri(1,4);
      const signos = {
        sen:['+','+','-','-'], cos:['+','-','-','+'], tan:['+','-','+','-']
      };
      const s = signos[f][cuad-1];
      showGenOutput(`Si el punto terminal de t está en el cuadrante ${cuad}, ¿${f} t es positivo o negativo?`,
        `<strong>${s==='+'?'Positivo':'Negativo'}</strong>`);
    }
  }
  else if(topic==='trigtriangulo'){
    const type = pick(['radgrad','pitagoras','leySenos']);
    if(type==='radgrad'){
      const toRad = Math.random()<0.5;
      if(toRad){
        const deg = pick([30,45,60,90,120,135,150,180,270,360]);
        showGenOutput(`Convertí ${deg}° a radianes (en términos de π)`,
          `${deg}° · (π/180) = <strong>${(deg/180)}π rad</strong> (simplificado según corresponda)`);
      } else {
        const num = pick([1,2,3,4,5,6]), den = pick([2,3,4,6]);
        showGenOutput(`Convertí ${num}π/${den} rad a grados`,
          `(${num}π/${den})·(180/π) = <strong>${Math.round(num*180/den)}°</strong>`);
      }
    } else if(type==='pitagoras'){
      const triples = [[3,4,5],[6,8,10],[5,12,13],[8,15,17],[7,24,25]];
      const [o,a,h] = pick(triples);
      showGenOutput(`Un triángulo rectángulo tiene cateto opuesto ${o} e hipotenusa ${h}. Encontrá sen θ y cos θ`,
        `Cateto adyacente = √(${h}²-${o}²) = ${a} → <strong>sen θ = ${o}/${h}, cos θ = ${a}/${h}</strong>`);
    } else {
      const A = ri(30,70), C = ri(20,60), c = ri(20,100);
      const B = 180 - A - C;
      const a = (c*Math.sin(A*Math.PI/180)/Math.sin(C*Math.PI/180)).toFixed(1);
      showGenOutput(`En el triángulo ABC: ∠A=${A}°, ∠C=${C}°, c=${c}. Encontrá el lado a (Ley de Senos)`,
        `∠B = 180-${A}-${C} = ${B}°<br>a = c·senA/senC = ${c}·sen${A}°/sen${C}° ≈ <strong>${a}</strong>`);
    }
  }
  else if(topic==='numeros-basicos'){
    const type = pick(['sumaEnteros','multEnteros','pemdas']);
    if(type==='sumaEnteros'){
      const a=ri(-20,20), b=ri(-20,20);
      showGenOutput(`Calculá: (${a}) + (${b})`, `<strong>${a+b}</strong>`);
    } else if(type==='multEnteros'){
      const a=ri(-12,12)||3, b=ri(-12,12)||4;
      showGenOutput(`Calculá: (${a}) × (${b})`, `<strong>${a*b}</strong>`);
    } else {
      const a=ri(2,9), b=ri(2,9), c=ri(2,9), d=ri(2,9);
      const res = a + b*c - d;
      showGenOutput(`Calculá aplicando el orden de las operaciones: ${a} + ${b}×${c} − ${d}`,
        `Multiplicación primero: ${b}×${c}=${b*c}<br><strong>${res}</strong>`);
    }
  }
  else if(topic==='potenciacion-cientifica'){
    const type = pick(['propiedad','cientifica']);
    if(type==='propiedad'){
      const b=pick([2,3,5]), m=ri(3,7), n=ri(1,3);
      showGenOutput(`Simplificá: ${b}<sup>${m}</sup> / ${b}<sup>${n}</sup>`,
        `${b}<sup>${m}-${n}</sup> = ${b}<sup>${m-n}</sup> = <strong>${Math.pow(b,m-n)}</strong>`);
    } else {
      const a = ri(1,9), zeros = ri(3,7);
      const num = a * Math.pow(10, zeros);
      showGenOutput(`Escribí ${num.toLocaleString('es')} en notación científica`,
        `<strong>${a} × 10<sup>${zeros}</sup></strong>`);
    }
  }
  else if(topic==='porcentajes'){
    const type = pick(['porcDe','directa']);
    if(type==='porcDe'){
      const pct = pick([10,15,20,25,30,40,50,60,75]), base = ri(4,40)*10;
      showGenOutput(`Calculá el ${pct}% de ${base}`,
        `${pct}/100 × ${base} = <strong>${(pct/100*base)}</strong>`);
    } else {
      const x1=ri(2,8), k=ri(50,500), x2=ri(2,15);
      const y1 = x1*k;
      showGenOutput(`Si ${x1} unidades cuestan $${y1}, ¿cuánto cuestan ${x2} unidades? (proporcionalidad directa)`,
        `k = ${y1}/${x1} = ${k}. ${x2} × ${k} = <strong>$${x2*k}</strong>`);
    }
  }
  else if(topic==='radicales'){
    const perfect = [4,9,16,25,36,49,64,81,100];
    const p = pick(perfect), extra = ri(2,7);
    const n = p*extra;
    showGenOutput(`Simplificá: √${n}`,
      `${n} = ${p}×${extra} → √${p}·√${extra} = <strong>${Math.sqrt(p)}√${extra}</strong>`);
  }
  else if(topic==='algebra-polinomios'){
    const type = pick(['semejantes','productoNotable']);
    if(type==='semejantes'){
      const a1=ri(2,9), a2=ri(1,8), b1=ri(1,9), b2=ri(1,9);
      showGenOutput(`Simplificá: ${a1}x + ${b1}y − ${a2}x + ${b2}y`,
        `(${a1}−${a2})x + (${b1}+${b2})y = <strong>${a1-a2}x + ${b1+b2}y</strong>`);
    } else {
      const a=ri(2,9), b=ri(2,9);
      showGenOutput(`Desarrollá: (x + ${a})²`,
        `x² + 2(x)(${a}) + ${a}² = <strong>x² + ${2*a}x + ${a*a}</strong>`);
    }
  }
  else if(topic==='factorizacion'){
    const type = pick(['difCuadrados','trinomio']);
    if(type==='difCuadrados'){
      const a = pick([2,3,4,5,6,7,8,9,10]);
      showGenOutput(`Factorizá: x² − ${a*a}`,
        `Diferencia de cuadrados → <strong>(x + ${a})(x − ${a})</strong>`);
    } else {
      const m=ri(2,9), n=ri(-9,-2);
      const b=m+n, c=m*n;
      showGenOutput(`Factorizá: x² ${b>=0?'+':'-'} ${Math.abs(b)}x ${c>=0?'+':'-'} ${Math.abs(c)}`,
        `Buscamos m·n=${c} y m+n=${b} → m=${m}, n=${n} → <strong>(x ${m>=0?'+':'-'} ${Math.abs(m)})(x ${n>=0?'+':'-'} ${Math.abs(n)})</strong>`);
    }
  }
  else if(topic==='ecuaciones-fundamentos'){
    const type = pick(['aditiva','cuadRaiz']);
    if(type==='aditiva'){
      const c=ri(-15,15), b=ri(-20,20);
      showGenOutput(`Resolvé: x + ${c} = ${b}`,
        `x = ${b} − ${c} = <strong>${b-c}</strong>`);
    } else {
      const x = pick([2,3,4,5,6,7]), a = ri(1,3);
      const c = a*x*x;
      showGenOutput(`Resolvé: ${a}x² − ${c} = 0`,
        `x² = ${c}/${a} = ${x*x} → <strong>x = ±${x}</strong>`);
    }
  }
  else if(topic==='valorabs-inecuaciones'){
    const type = pick(['ecuacion','inecuacion']);
    if(type==='ecuacion'){
      const a=ri(2,6), b=ri(-10,10), k=ri(5,20);
      showGenOutput(`Resolvé: |${a}x ${b>=0?'+':'-'} ${Math.abs(b)}| = ${k}`,
        `Caso 1: ${a}x${b>=0?'+':''}${b}=${k} → x=${(k-b)/a}<br>Caso 2: ${a}x${b>=0?'+':''}${b}=${-k} → x=${(-k-b)/a}<br><strong>S = {${(-k-b)/a}, ${(k-b)/a}}</strong>`);
    } else {
      const k = ri(2,10), c = ri(-10,10);
      showGenOutput(`Resolvé: |x ${c>=0?'-':'+'} ${Math.abs(c)}| &lt; ${k}`,
        `−${k} &lt; x${c>=0?'-':'+'}${Math.abs(c)} &lt; ${k} → <strong>${c-k} &lt; x &lt; ${c+k}</strong>`);
    }
  }
  else if(topic==='sistemas-ecuaciones'){
    const x = ri(-8,8), y = ri(-8,8);
    const a1=ri(1,4), b1=ri(1,4), a2=ri(1,4), b2=pick([-3,-2,-1,1,2,3]);
    if(a1*b2 - a2*b1 === 0){ showGenOutput('Repetí la generación (sistema sin solución única)', 'Volvé a generar'); return; }
    const c1 = a1*x + b1*y;
    const c2 = a2*x + b2*y;
    showGenOutput(`Resolvé el sistema: ${a1}x + ${b1}y = ${c1} &nbsp;·&nbsp; ${a2}x ${b2>=0?'+':'-'} ${Math.abs(b2)}y = ${c2}`,
      `Por sustitución o reducción se obtiene <strong>x = ${x}, y = ${y}</strong>`);
  }
  else if(topic==='geometria-basica'){
    const type = pick(['pitagoras','areaRect']);
    if(type==='pitagoras'){
      const triples = [[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15]];
      const [a,b,c] = pick(triples);
      showGenOutput(`Un triángulo rectángulo tiene catetos ${a} y ${b}. Encontrá la hipotenusa`,
        `c² = ${a}² + ${b}² = ${a*a+b*b} → <strong>c = ${c}</strong>`);
    } else {
      const b=ri(3,20), h=ri(3,20);
      showGenOutput(`Encontrá el perímetro y el área de un rectángulo de base ${b} y altura ${h}`,
        `Perímetro = 2(${b}+${h}) = <strong>${2*(b+h)}</strong><br>Área = ${b}×${h} = <strong>${b*h}</strong>`);
    }
  }
  else if(topic==='funciones-fundamentos'){
    const type = pick(['pendiente','verticeCuad']);
    if(type==='pendiente'){
      const x1=ri(-8,8), y1=ri(-8,8), x2=ri(-8,8), y2=ri(-8,8);
      if(x2===x1){ showGenOutput('Repetí la generación (recta vertical)', 'Volvé a generar'); return; }
      const m = (y2-y1)/(x2-x1);
      showGenOutput(`Encontrá la pendiente de la recta que pasa por (${x1},${y1}) y (${x2},${y2})`,
        `m = (${y2}-(${y1}))/(${x2}-(${x1})) = <strong>${m}</strong>`);
    } else {
      const a=pick([1,-1,2,-2]), b=ri(-8,8);
      const vx=-b/(2*a);
      showGenOutput(`Encontrá la coordenada x del vértice de f(x) = ${a}x² ${b>=0?'+':'-'} ${Math.abs(b)}x`,
        `x = -b/(2a) = -(${b})/(2·${a}) = <strong>${vx}</strong>`);
    }
  }
  else if(topic==='trigonometria-analitica'){
    const type = pick(['pitagorica','angDoble']);
    if(type==='pitagorica'){
      showGenOutput(`Simplificá: sen²θ + cos²θ + tan²θ − sec²θ`,
        `sen²θ+cos²θ=1 y tan²θ−sec²θ=−1 → 1 + (−1) = <strong>0</strong>`);
    } else {
      const cosx = pick([[-2,3],[1,3],[-3,5],[4,5]]);
      const [num,den] = cosx;
      const cos2x = 2*(num/den)*(num/den) - 1;
      showGenOutput(`Si cos x = ${num}/${den}, encontrá cos 2x usando la fórmula de ángulo doble`,
        `cos 2x = 2cos²x − 1 = 2(${num}/${den})² − 1 = <strong>${cos2x.toFixed(3)}</strong>`);
    }
  }
}

/* Init */
renderStations();
</script>
